  /api/drafts/{draft}/discard:
    post:
      operationId: drafts.discard
      tags:
      - Drafts
      summary: Drop the caller's open draft
      description: Only the owner discards. An open draft (`drafting` or `ready`) becomes `discarded`, with `draft.discarded`
        journaled to the site's conversation in the same transaction. One already discarded answers as it stands;
        one a press has claimed answers `draft-applying`; one applied or stale answers `stale-draft`. Takes an `Idempotency-Key`.
      parameters:
      - name: draft
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: The draft's ULID; one that does not parse answers `not-found`.
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The draft, discarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftRead'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          description: Problem `idempotency-key-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Problem `identity-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Problem `not-draft-owner`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `not-found`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem `draft-applying`, `stale-draft`, or `idempotency-key-in-flight`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem `idempotency-key-reused` (or `validation-failed` for a malformed key).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/experiments:
    post:
      operationId: experiments.create
      tags:
      - Experiments
      summary: Prepare an experiment
      description: 'Checks the request and stores the experiment, unchangeable from then on. The request names a
        scenario version at a revision and one of three forms: a single run (no `varies`, no `repeats`), repeats
        of it (1 to 10, each with the next simulation seed from the version''s `run_controls.seed`), or a sweep
        of one of the scenario''s own sweepable fields over 2 to 12 distinct values, with repeats. `varies.target`
        must be `scenario:{this scenario''s ULID}`; `varies.pointer` must be a catalogue field marked `sweepable`;
        each value must leave the content passing its checks. `run_overrides` (duration, report window) are checked
        against the content. Variants, seeds, `run_order` (every variant at the first seed, then every variant at
        the next) and `kind` are derived, never authored. Nothing is generated, compiled or loaded here. Idempotent
        under an `Idempotency-Key`.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentRequest'
      responses:
        '201':
          description: The experiment as stored, `submission` null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          description: Problem type `idempotency-key-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Problem type `identity-missing` (from the identity layer; unclear from this module's code).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'Problem type `not-found`: no scenario has the id, or it has no such version.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Problem type `scenario-changed`: the version is not at `revision` (`conflicts` is empty;
            prepare again from what it holds now); `scenario-deleted`: the scenario was deleted; `idempotency-key-in-flight`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Problem type `validation-failed`: the body does not read; `/repeats` is outside 1 to 10
            or would take the simulation seed past 2^53 - 1; `/run_overrides/duration_sim_ms` or the report window
            fails its check; `/varies/target` is not this scenario; `/varies/pointer` names no sweepable field;
            `/varies/values` has fewer than 2, more than 12 or repeated values, or a value fails the content''s
            checks. `idempotency-key-reused`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/experiments/{experiment}:
    get:
