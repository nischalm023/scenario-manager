              schema:
                type: string
              description: '`public, max-age=31536000, immutable`'
          content:
            application/vnd.worldview-floor+msgpack:
              schema:
                type: string
                format: binary
        '404':
          description: '`not-found`: no floor is held under this key (malformed key, a store key that is not there,
            a site key this process did not mint or whose cut now exports other bytes); read the map again for its
            floor''s key. Also world-proto-server failures mapped by the client: `not-found`, `pin-unresolved`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
