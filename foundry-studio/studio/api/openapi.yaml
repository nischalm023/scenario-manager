        '400':
          description: Problem `idempotency-key-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Problem `identity-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `pin-unresolved`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem `draft-changed` (the caller already holds an open draft on this site; its id and
            revision are in `detail`), `head-moved` (with `moved`), `generators-moved`, or `idempotency-key-in-flight`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem `validation-failed` (body does not read, `site` is no location or site root, `ops`
            is empty, an operation targets no flow entity or map sector of the cut, or the would-be site will not
            load), `idempotency-key-reused`, or `export-not-closed`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Problem `wps-not-ready`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Problem `wps-fault` or `wps-outcome-unknown`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Problem `wps-unavailable` or `compute-busy`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/drafts/{draft}:
    parameters:
    - name: draft
      in: path
      required: true
