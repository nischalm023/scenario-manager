                $ref: '#/components/schemas/Problem'
        '403':
          description: Problem `not-draft-owner`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `not-found`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem `draft-applying` (a press has claimed it), `stale-draft` (applied, discarded or stale),
            `draft-changed` (the revision is not the stored one, or the row changed while the edit was checked),
            or `idempotency-key-in-flight`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem `validation-failed` (body does not read, an operation targets no flow entity or map
            sector, or the would-be site will not load), `idempotency-key-reused`, or `export-not-closed`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Problem `wps-not-ready`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Problem `wps-fault` or `wps-outcome-unknown`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Problem `wps-unavailable` or `compute-busy`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/drafts/{draft}/apply:
    post:
      operationId: drafts.press
      tags:
      - Drafts
      summary: Apply, the owner's approval of exactly the revision they checked
      description: The press on a draft. A draft already `applying` or `applied` answers the approval that claimed
        it. If the agent's own approval of the same apply waits on the site's conversation, the press decides it
        first (same input approves it and the press answers with that approval; other values deny it and the press
        records its own). Otherwise the draft must be open; the would-be site is checked once more on the stored
        cut (an error answers `validation-failed` carrying the problems), and a scope of the cut that moved past
        its changeset stales the draft (`head-moved`, journaled as `draft.stale`). Then, under the row lock in one
        transaction, the press is recorded as a button approval (`tool` `changeset.apply`, class `apply`), the changeset
        is built under the approval's id and kept, and the draft is claimed `applying`; a background worker sends
        it to the world store, and the draft settles to `applied`, back to `drafting` (refused, with the refusal
        among its problems) or `stale`. Poll `GET /api/approvals/{a}` or the draft for the outcome. Takes an `Idempotency-Key`.
      parameters:
      - name: draft
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: The draft's ULID; one that does not parse answers `not-found`.
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The approval that claims (or already claimed) the draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAnswer'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          description: Problem `idempotency-key-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Problem `identity-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Problem `not-draft-owner`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `not-found`, or `pin-unresolved` from the world store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem `draft-applying` (claimed but naming no approval), `stale-draft` (discarded or stale),
            `head-moved` (with `moved`; the draft is now stale), `draft-changed` (the draft changed while it was
            checked), `provider-changed` (the agent's waiting approval began under another model provider), or `idempotency-key-in-flight`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Problem `validation-failed` ("Not applied: the flow would not compile", with `problems`;
            or the would-be site will not build or load), `idempotency-key-reused`, or `export-not-closed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Problem `wps-not-ready`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Problem `wps-fault` or `wps-outcome-unknown`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Problem `wps-unavailable`, `compute-busy`, or `agent-busy` (no permit to resume the agent's
            turn).
