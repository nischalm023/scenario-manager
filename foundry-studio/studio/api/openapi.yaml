      - state
      - floor_key
      - census
      - problems
      properties:
        state:
          $ref: '#/components/schemas/ThumbnailState'
        floor_key:
          type:
          - string
          - 'null'
          description: The floor document's key for `GET /api/floors/{key}` (`template-thumbnails/{row}/floor.msgpack`).
        census:
          oneOf:
          - $ref: '#/components/schemas/Census'
          - type: 'null'
        problems:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationProblem'
    ThumbnailState:
      type: string
      enum:
      - evaluating
      - ready
      - failed
    TurnCalls:
      type: object
      required:
      - calls
      properties:
        calls:
          type: array
          items:
            $ref: '#/components/schemas/CallRead'
    TurnNumber:
      type: integer
      minimum: 1
      description: A turn's number in its conversation, 1 for the first.
    TurnState:
      type: string
      enum:
      - running
      - waiting
      - done
      - failed
      - stopped
      - interrupted
    Ulid:
      type: string
