      required:
      - block
      - offset
      - delta
      properties:
        block:
          $ref: '#/components/schemas/BlockId'
        offset:
          $ref: '#/components/schemas/TextOffset'
        delta:
          type: string
    TextOffset:
      type: integer
      minimum: 0
