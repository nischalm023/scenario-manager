[package]
name = "desunits"
version = "0.1.0"
edition = "2024"
description = "The quantities and identities every crate that speaks about a simulation run shares: simulated time, physical distance, and the ids of the things a run names"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"
rmp-serde = "1"
serde_json = "1"
