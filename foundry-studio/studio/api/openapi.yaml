          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /runner/v1/attempts/{run}/{n}/manifest:
    servers:
    - url: http://127.0.0.1:3101
      description: The runners' listener (`STUDIO_RUNNER_BIND`; its port varies per checkout).
    put:
      operationId: runner.manifest
      tags:
      - RunnerDoor
      summary: Hand in an attempt's manifest
      description: 'Served on the runners'' listener; opens only with the attempt''s own bearer token, and the path
        must name that

        attempt. The manifest is handed in once, before simtime starts: it is kept with the attempt, compared with

        the check''s expectation and reads, and each finding (`plan-differs`, `read-differs`, `compiler-differs`)
        is

        journaled once; none stops the run. Its arrival moves a `queued` attempt to `running`. The same bytes sent

        again answer the first outcome; different bytes are refused `manifest-differs`. The body is at most 1 MiB

        (a larger one is refused by the framework with 413, not as a problem document).

        '
      security:
      - RunnerToken: []
      parameters:
      - name: run
        in: path
        required: true
        description: The run's ULID.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: n
        in: path
        required: true
        description: The attempt number within the run, from 1.
        schema:
          $ref: '#/components/schemas/AttemptNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manifest'
      responses:
        '200':
          description: What the API found comparing the manifest with the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestAccepted'
        '401':
          description: Problem type `runner-token-invalid`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem type `manifest-differs` (this attempt handed in another manifest already).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem type `validation-failed` (the body does not read as a `Manifest`, or its `run`/`attempt`
            name another attempt than the route).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no route serves this path, or the object named does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /runner/v1/attempts/{run}/{n}/heartbeat:
    servers:
    - url: http://127.0.0.1:3101
      description: The runners' listener (`STUDIO_RUNNER_BIND`; its port varies per checkout).
    put:
      operationId: runner.heartbeat
      tags:
      - RunnerDoor
      summary: Say the runner is alive and how far it is
      description: 'Served on the runners'' listener; opens only with the attempt''s own bearer token, and the path
        must name that attempt. Sent every 5 s of wall clock from the runner''s start: the API writes the instant it
        came, the simtime reached (never backwards) and the values on the attempt''s row, which `GET /api/runs/{run}`
        answers. Kept while the attempt is queued or running; `attempt-ended` after. A beat that does not land is not
        sent again; the next comes in 5 s.

        '
      security:
      - RunnerToken: []
      parameters:
      - name: run
        in: path
        required: true
        description: The run's ULID.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: n
        in: path
        required: true
        description: The attempt number within the run, from 1.
        schema:
          $ref: '#/components/schemas/AttemptNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '204':
          description: Kept.
        '401':
          description: Problem type `runner-token-invalid`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem type `attempt-ended`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem type `validation-failed` (the body does not read as a `Heartbeat`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no route serves this path, or the object named does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /runner/v1/attempts/{run}/{n}/recording:
    servers:
    - url: http://127.0.0.1:3101
      description: The runners' listener (`STUDIO_RUNNER_BIND`; its port varies per checkout).
    put:
      operationId: runner.recording
      tags:
      - RunnerDoor
      summary: Send an attempt's recording to be stored
      description: 'Served on the runners'' listener; opens only with the attempt''s own bearer token, and the path
        must name that attempt. The runner''s `.worldview` recording once its run is over, which the API stores under
        `runs/{run}/attempts/{n}/recording.worldview` in the run store, so that no runner holds a credential for the
        store (ruling D174). The body is at most 8 GiB and must be a whole recording, closed through its trailer, as
        every run writes one; an empty or cut-off body is refused and stores nothing. The attempt takes one recording:
        the bytes of the first upload that begins storing them are its own from then on, so the same bytes again are
        answered the same receipt and other bytes are refused `recording-differs`. The recording is accepted on the
        attempt''s row only while the attempt is queued or running, `attempt-ended` after, and stays there whoever
        ends the attempt, whether or not a report follows. The answer is the receipt the runner''s report then names.
        The API''s own storage failing answers 500, which the runner asks again.

        '
      security:
      - RunnerToken: []
      parameters:
      - name: run
        in: path
        required: true
        description: The run's ULID.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: n
        in: path
        required: true
        description: The attempt number within the run, from 1.
        schema:
          $ref: '#/components/schemas/AttemptNumber'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The recording as it was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingStored'
        '401':
          description: Problem type `runner-token-invalid`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem type `attempt-ended`, or `recording-differs` (the attempt took other bytes first).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem type `validation-failed` (the body does not read as a recording, stops before its
            trailer, did not arrive whole, or passes 8 GiB).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no route serves this path, or the object named does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /runner/v1/attempts/{run}/{n}/results:
    servers:
    - url: http://127.0.0.1:3101
      description: The runners' listener (`STUDIO_RUNNER_BIND`; its port varies per checkout).
    put:
      operationId: runner.results
      tags:
      - RunnerDoor
      summary: Deliver an attempt's results
      description: 'Served on the runners'' listener; opens only with the attempt''s own bearer token, and the path
        must name that attempt. The runner''s own delivery of what it left once the run is over, since a Job''s pod
        keeps no folder the API could read: the ending, the metrics and series files, and the recording it sent first
        through `PUT .../recording`, as that route answered it, which must be the receipt the attempt keeps. Written
        as the attempt''s ending; the first ending wins, and a report after it answers `already-ended` and changes
        nothing. The recording the attempt accepted stays whatever the report names. The body is at most 32 MiB (a long
        run''s series file passes the listener''s 1 MiB).

        '
      security:
      - RunnerToken: []
      parameters:
      - name: run
        in: path
        required: true
        description: The run's ULID.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: n
        in: path
        required: true
        description: The attempt number within the run, from 1.
        schema:
          $ref: '#/components/schemas/AttemptNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultsReport'
      responses:
        '200':
          description: Whether the report's ending took.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsAccepted'
        '401':
          description: Problem type `runner-token-invalid`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem type `validation-failed` (the body does not read as a `ResultsReport`, its ending is not
            an ending, or the recording it names is not the one this attempt accepted through its recording route).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no route serves this path, or the object named does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
