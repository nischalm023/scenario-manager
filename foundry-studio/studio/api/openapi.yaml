      summary: Readiness of a version at its site's heads of main
      description: 'Reads one version, the latest by default, against one consistent cut of its site''s scopes at
        the heads of `main`: the cut is resolved, the site exported, and the version loaded as a run of the runner
        image would (the simulator''s reader, the closed values the image accepts, the workload generated in process,
