    patch:
      operationId: scenarios.edit
      tags:
      - Scenarios
      summary: Edit the latest version (field merge)
      description: 'Spec 07 section 3.5''s edit, in one transaction under the scenario''s and the version''s locks.
        The body names the `version` and `revision` the edit was based on and the fields it sets, each by JSON pointer.
        Only the latest version is edited: another `version` is refused `scenario-changed`, with a conflict per
        set pointer holding the latest version''s value of it. Pointers `/name` and `/description` are the scenario
        row''s: they rename the row (name 1 to 120 characters, unique on the site; description at most 2,000) and
        open no version and no revision. Every other pointer must be a field of the field catalogue or a group holding
        such fields (for example `/workload/generator`); `revision` must be at most the latest version''s revision.
        Two pointers overlap when they are equal or one is the other''s ancestor. Any field whose last change is
        at a revision after `revision` and overlaps a set pointer refuses the whole edit as `scenario-changed`,
        listing each such field with its value now and its last change in `conflicts`. Otherwise the fields apply
        in order to the latest content, the whole merged content is checked (so two disjoint edits cannot together
        break a rule joining fields), and `set_by` records the caller for each set pointer, replacing entries beneath
        it. An open version takes the next revision (`opened: false`); a sealed version is copied into the next
        version at revision 1 with the edit applied and every carried field recorded at revision 1 (`opened: true`).
        An edit that sets only row fields answers the latest version and revision unchanged.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioEdit'
      responses:
        '200':
          description: The edit was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioEdited'
        '401':
          description: Problem type `identity-missing` (from the identity layer; unclear from this module's code).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
