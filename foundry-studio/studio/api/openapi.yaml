        `flow-empty`. The module''s charter says a patch at a field the catalogue does not mark sweepable is refused
        as `not-sweepable`; the handler itself raises no such problem type, so whether that arrives as a compiler
        problem item is (unclear from code).'
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
        description: 'An axum wildcard (`{*location}`) capturing a scope path with slashes: a site''s flow scope
          at a pin, `customer/{customer}/site/{site}/flow` optionally followed by `@` and a pin (`@main`, `@tag:v3`,
          `@7`); without a pin it is read at `@main`. Any other scope answers `validation-failed`.'
