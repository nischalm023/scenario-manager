        ops:
          type: array
          items:
            $ref: '#/components/schemas/ChangesetOp'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ChangesetPart'
        problems:
          type: array
          items:
            $ref: '#/components/schemas/ProblemItem'
