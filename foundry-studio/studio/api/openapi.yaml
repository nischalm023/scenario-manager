  /api/resolve:
    post:
      tags:
      - Map
      operationId: map.resolve
      summary: Resolve references into marks
      description: 'Each reference a panel or a tool names, read at the panel''s location and expanded to its marks
        there, or the whole call refused so a panel never shows a highlight the API could not resolve. `map`: entities
        of the site at the location''s cut, expanded by the map rows (needs `location`; takes no `draft`). `template`:
        a key marks itself; with a `template-draft:{ulid}` location, an entity of its newest ready evaluation marks
        itself on that evaluation''s floor. `scenario`: every reference marks its own key. `runs`: only non-entity
        references, each marking its own key; a run target is not resolvable on this build. `flow`: not built yet
        (`panel-mismatch`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: The cut read and each reference in the order asked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resolution'
        '404':
          description: '`location-unresolved`: there is no such scope; the template draft has no evaluation drawn
            yet; or a run target (runs are not recorded on this build). Also `pin-unresolved` from world-proto-server.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: the body does not read; `refs` is empty; the Map panel was given no
            location. `ref-malformed`: a reference, the location or `kin` is off the grammar. `ref-pin-conflicts`:
            a reference inside the site carries a pin. `ref-needs-version`: a lateral reference carries no version.
            `ref-unresolved`: a reference names nothing at the location, each named in `problems`. `panel-mismatch`:
            a `draft` on the Map panel, the Flow panel, a Template location that is not a template draft, or a Map
            location that is not a site''s map. `floor-compile-failed`: the site''s document will not load. Also
            `export-not-closed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`: the evaluation''s floor or plan could not be read from the run-object store.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: '`wps-not-ready`: a changeset pin on a site of several scopes, or a world-proto-server failure
            so mapped.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 'world-proto-server failure mapped by the client: `wps-fault`, `wps-outcome-unknown`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'world-proto-server failure mapped by the client: `wps-unavailable`, `compute-busy` (with
            `Retry-After`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
