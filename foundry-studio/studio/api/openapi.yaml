      - revision
      - set
      properties:
        version:
          $ref: '#/components/schemas/VersionNumber'
        revision:
          $ref: '#/components/schemas/Revision'
        set:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldSet'
    ScenarioEdited:
      type: object
      description: 'An accepted edit: the version and revision it made, `opened` when it opened a new version.'
      required:
      - version
      - revision
      - opened
      properties:
        version:
          $ref: '#/components/schemas/VersionNumber'
        revision:
          $ref: '#/components/schemas/Revision'
        opened:
          type: boolean
    ScenarioList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioSummary'
    ScenarioRead:
      type: object
      required:
      - scenario
      - versions
      - version
      properties:
        scenario:
          $ref: '#/components/schemas/ScenarioRow'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionSummary'
        version:
          $ref: '#/components/schemas/VersionRead'
    ScenarioRow:
      type: object
      description: A scenario's row; `deleted_by` and `deleted_at` are set together by a delete, after which nothing
        edits it.
      required:
      - id
      - name
      - description
      - site_scope
      - latest_version
      - created_by
      - created_at
      - changed_at
      - deleted_by
      - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        description:
          type: string
        site_scope:
          $ref: '#/components/schemas/SitePath'
        latest_version:
          $ref: '#/components/schemas/VersionNumber'
        created_by:
          $ref: '#/components/schemas/Person'
        created_at:
          $ref: '#/components/schemas/WallClock'
        changed_at:
          $ref: '#/components/schemas/WallClock'
        deleted_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        deleted_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
    ScenarioSummary:
      type: object
      required:
      - id
      - name
      - latest_version
      - state
      - runs
      - changed_at
      - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        latest_version:
          $ref: '#/components/schemas/VersionNumber'
        state:
          $ref: '#/components/schemas/VersionState'
        runs:
          $ref: '#/components/schemas/RunCounts'
        changed_at:
          $ref: '#/components/schemas/WallClock'
        deleted_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
    ScopeEventKind:
      type: string
      enum:
      - scope.moved
      - ping
    ScopeMoved:
      type: object
      description: '`scope.moved`''s body: `scope` moved to changeset `seq`; `gap` when changesets in between went
        untold.'
      required:
      - scope
      - seq
      - gap
      properties:
        scope:
          $ref: '#/components/schemas/ScopePath'
        seq:
          $ref: '#/components/schemas/Seq'
        gap:
          type: boolean
    ScopePath:
      type: string
      description: A scope's path in world-proto-server, 1 to 8 slugs joined by `/`, every prefix itself a scope
        (`customer/demo/site/lshape-6/map`).
    ScopeSeq:
      type: object
      description: A scope and the changeset it was resolved to.
      required:
      - scope
      - seq
      properties:
        scope:
          $ref: '#/components/schemas/ScopePath'
        seq:
          $ref: '#/components/schemas/Seq'
    SealedVersion:
      type: object
      description: Answer of `GET /runner/v1/scenarios/{scenario}/versions/{version}`.
      required:
      - scenario
      - version
      properties:
        scenario:
          $ref: '#/components/schemas/Ulid'
        version:
          $ref: '#/components/schemas/VersionRead'
    Seed:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: A seed, the generator's or the simulation's; an integer 0 to 2^53 - 1, exact in JSON.
    Seq:
      type: integer
      minimum: 0
      description: A changeset's sequence number in a scope.
    SeriesFile:
      type: object
      description: '`series.json`: every declared metric''s values at the instants the recording holds them. Not
        served by any route here.'
      additionalProperties: false
      required:
      - v
      - slice_sim_ms
      - end_sim_ms
      - metrics
      properties:
        v:
          $ref: '#/components/schemas/FileFormat'
        slice_sim_ms:
          type: integer
          format: int64
          description: Simtime milliseconds.
        end_sim_ms:
          type: integer
          format: int64
          description: Simtime milliseconds.
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricSeries'
    SeriesKind:
      type: string
      description: An accumulating metric's running value at each slice end, or a gauge's readings at each slice
        that stated one.
      enum:
      - running
      - readings
    SeriesPoint:
      type: array
      description: One instant in simtime milliseconds and the value there, null where the run had stated none yet.
      prefixItems:
      - type: integer
        format: int64
      - type:
        - number
        - 'null'
      minItems: 2
      maxItems: 2
    SeriesReply:
      type: object
      description: One metric by simulated period from the run's start, never thinned; `window` is the report window
        as far as the attempt got.
      required:
      - run
      - attempt
      - metric
      - label
      - unit
      - aggregation
      - kind
      - points
      - window
      properties:
        run:
          $ref: '#/components/schemas/Ulid'
        attempt:
          $ref: '#/components/schemas/AttemptNumber'
        metric:
          type: string
        label:
          type: string
        unit:
          $ref: '#/components/schemas/MetricUnit'
        clock:
          $ref: '#/components/schemas/DurationClock'
        aggregation:
          $ref: '#/components/schemas/Aggregation'
        kind:
          $ref: '#/components/schemas/SeriesShape'
        period_sim_ms:
          type: integer
          format: int64
          minimum: 1
          description: The period's length in milliseconds of simtime; present only when `kind` is `per_period`.
        points:
          type: array
          items:
            $ref: '#/components/schemas/PeriodPoint'
        window:
          $ref: '#/components/schemas/SimWindow'
    SeriesShape:
      type: string
      description: 'How a series reads: an additive metric''s value per period, or any other class''s readings as
        stated.'
      enum:
      - per_period
      - readings
    SetBy:
      type: object
      description: 'The last change of one field: by the agent or a person, in which turn, when (wall clock) and
        at which revision.'
      required:
      - by
      - author
      - turn
      - at
      - revision
      properties:
        by:
          $ref: '#/components/schemas/Setter'
        author:
          $ref: '#/components/schemas/Person'
        turn:
          oneOf:
          - $ref: '#/components/schemas/SetInTurn'
          - type: 'null'
        at:
          $ref: '#/components/schemas/WallClock'
        revision:
          $ref: '#/components/schemas/Revision'
    SetByKind:
      type: string
      enum:
      - template
      - agent
      - user
    SetInTurn:
      type: object
      description: The conversation turn a field was set in.
      required:
      - id
      - n
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        n:
          $ref: '#/components/schemas/TurnNumber'
    SetKnobs:
      type: object
      description: '`PATCH /api/template-drafts/{d}` body. Unknown fields are refused.'
      additionalProperties: false
      required:
      - revision
      - knobs
      properties:
        revision:
          type: integer
          format: int32
          minimum: 0
          description: The draft revision the values were read at.
        knobs:
          type: object
          description: The values to set by knob key; `null` returns a knob to its default.
          additionalProperties:
            oneOf:
            - $ref: '#/components/schemas/KnobValue'
            - type: 'null'
    Setter:
      type: string
      enum:
      - agent
      - user
      description: Who set a field, the agent or a person.
    Severity:
      type: string
      enum:
      - error
      - warning
      description: Whether the item stops what it is found on (`error`) or only says so (`warning`).
    SimWindow:
      type: object
      description: A span of simtime between two instants the recording holds values for, in milliseconds.
      required:
      - from_sim_ms
      - to_sim_ms
      properties:
        from_sim_ms:
          type: integer
          format: int64
        to_sim_ms:
          type: integer
          format: int64
    SiteBranch:
      type: object
      description: One branch of a site and each of its scopes' heads on it.
      required:
      - name
      - heads
      properties:
        name:
          $ref: '#/components/schemas/BranchName'
        heads:
          type: object
          description: Scope path to head changeset, in path order.
          additionalProperties:
            $ref: '#/components/schemas/Seq'
    SiteConversation:
      type: object
      description: A site's live conversation as the list shows it.
      required:
      - id
      - waiting
      - working
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        waiting:
          oneOf:
          - $ref: '#/components/schemas/WaitingOn'
          - type: 'null'
        working:
          type:
          - boolean
          - 'null'
          description: Whether a turn is `running`.
    SiteItem:
      type: object
      required:
      - site
      - name
      - branches
      - tags
      - changed_at
      - conversation
      properties:
        site:
          $ref: '#/components/schemas/SitePath'
        name:
          type:
          - string
          - 'null'
          description: From the root's prologue; null when it states none.
        branches:
          type: array
          items:
            $ref: '#/components/schemas/SiteBranch'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagName'
        changed_at:
          $ref: '#/components/schemas/WallClock'
        conversation:
          oneOf:
          - $ref: '#/components/schemas/SiteConversation'
          - type: 'null'
    SiteList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteItem'
    SiteMade:
      type: object
      description: 'What a write made: the site, each of its scopes'' changesets, and its made-from record.'
      required:
      - site
      - seqs
      - made_from
      properties:
        site:
          $ref: '#/components/schemas/SitePath'
        seqs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Seq'
        made_from:
          $ref: '#/components/schemas/Ulid'
    SitePath:
      type: string
      description: A site's scope path, the fourth level of a `ScopePath` (`customer/<c>/site/<s>`), which a conversation
        is keyed by.
    SkuCount:
      type: integer
      format: int32
      minimum: 0
      description: How many SKUs the generator draws from; 1 to 100,000.
    SlotCount:
      type: integer
      format: int64
      minimum: 0
      description: The site's inventory tote slots.
    Snapshot:
      type: object
      description: '`GET /api/conversations/{c}`''s answer, read at `last_seq`.'
      required:
      - conversation
      - entries
      - projection
      - pending
      - active_turn
      - last_seq
      properties:
        conversation:
          $ref: '#/components/schemas/Conversation'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
        projection:
          $ref: '#/components/schemas/Projection'
        pending:
          $ref: '#/components/schemas/Pending'
        active_turn:
          oneOf:
          - $ref: '#/components/schemas/ActiveTurn'
          - type: 'null'
        last_seq:
          $ref: '#/components/schemas/JournalSeq'
    StartDraft:
      type: object
      description: '`POST /api/template-drafts` body. Unknown fields are refused.'
      additionalProperties: false
      properties:
        template:
          type:
          - string
          - 'null'
          description: The template location to start from (`template/site/l-shape@main`); required on this build.
        site:
          type:
          - string
          - 'null'
          description: A made site for an update draft; refused on this build (not built yet).
        conversation:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
          description: The asking person's live New site conversation the draft runs in.
        browser_tab:
          type:
          - string
          - 'null'
          description: Not read by the handler.
        context:
          description: Any JSON; not read by the handler.
    StopAccepted:
      type: object
      required:
      - turn
      properties:
        turn:
          $ref: '#/components/schemas/Ulid'
    StreamKind:
      type: string
      enum:
      - stream.live
      - ping
      - stream.reset
      description: The event names the conversation stream makes itself.
    StreamLive:
      type: object
      description: '`stream.live`''s body: the last journaled number the connection replayed.'
      required:
      - last_seq
      properties:
        last_seq:
          $ref: '#/components/schemas/JournalSeq'
    StreamReset:
      type: object
      description: '`stream.reset`''s body; the tab reads the snapshot again.'
      required:
      - reason
      properties:
        reason:
          $ref: '#/components/schemas/ResetReason'
    StreamingBlock:
      type: object
      description: A block still streaming and its text so far.
      required:
      - block
      - text
      properties:
        block:
          $ref: '#/components/schemas/BlockId'
        text:
          type: string
    StreamingServer:
      type: object
      description: The streaming server a dispatcher picked for an attempt (ruling D174), in its job spec; its
        registration's id and the websocket address of its runners' port as a runner reaches it.
      required:
      - server
      - endpoint
      properties:
        server:
          $ref: '#/components/schemas/Ulid'
        endpoint:
          type: string
    Subject:
      type: string
      minLength: 1
      description: A person's stable identity from the login gate, Keycloak's `sub`. Never blank.
    SubmissionCancelled:
      type: object
      description: 202 to `POST /api/submissions/{submission}/cancel`.
      required:
      - outcomes
      properties:
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/RunCancelled'
    SubmitRequest:
      type: object
      description: Body of `POST /api/runs`. The plan to execute and the `plan_sha256` its approver saw, which must
        equal the plan's current hash.
      additionalProperties: false
      required:
      - plan
      - plan_sha256
      properties:
        plan:
          $ref: '#/components/schemas/Ulid'
        plan_sha256:
          type: string
    Submitted:
      type: object
      description: What a submission's execution answered, kept as its approval's `outcome` when the execution is
        `ok`.
      required:
      - submission
      - runs
      properties:
        submission:
          $ref: '#/components/schemas/Ulid'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Ulid'
    Sweep:
      type: object
      required:
      - varies
      properties:
        varies:
          $ref: '#/components/schemas/Varied'
    TagName:
      type: string
      description: A tag's name (newtype over a string). Always null on this build, until world-proto-server has
        tags.
    Tally:
      type: integer
      format: int64
      minimum: 0
      description: A count of orders, lines, SKUs or units of stock.
    TemplateAt:
      type: object
      description: 'A template as a draft read it: its root scope, its tag (null until tags), and each of its scopes''
        changesets.'
      required:
      - ref
      - tag
      - seqs
      properties:
        ref:
          $ref: '#/components/schemas/ScopePath'
        tag:
          oneOf:
          - $ref: '#/components/schemas/TagName'
          - type: 'null'
        seqs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Seq'
    TemplateCard:
      type: object
      description: One card of the Template list.
      required:
      - ref
      - title
      - text
      - built_from
      - tag
      - seqs
      - knobs
      - flows
      - thumbnail
      properties:
        ref:
          $ref: '#/components/schemas/ScopePath'
        title:
          type: string
        text:
          type: string
        built_from:
          type:
          - string
          - 'null'
        tag:
          oneOf:
          - $ref: '#/components/schemas/TagName'
          - type: 'null'
        seqs:
          type: object
          description: The changeset each of the template's scopes was read at, keyed by scope path, in path order.
          additionalProperties:
            $ref: '#/components/schemas/Seq'
        knobs:
          type: array
          items:
            $ref: '#/components/schemas/KnobDeclaration'
        flows:
          type: array
          description: The template's material edges' names.
          items:
            type: string
        thumbnail:
          $ref: '#/components/schemas/Thumbnail'
    TemplateDescription:
      type: object
      required:
      - title
      - text
      - built_from
      properties:
        title:
          type: string
        text:
          type: string
        built_from:
          type:
          - string
          - 'null'
    TemplateDetail:
      type: object
      description: One template's declarations and its default evaluation.
      required:
      - ref
      - tag
      - seqs
      - description
      - knobs
      - flows
      - default
      properties:
        ref:
          $ref: '#/components/schemas/ScopePath'
        tag:
          oneOf:
          - $ref: '#/components/schemas/TagName'
          - type: 'null'
        seqs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Seq'
        description:
          $ref: '#/components/schemas/TemplateDescription'
        knobs:
          type: array
          items:
            $ref: '#/components/schemas/KnobDeclaration'
        flows:
          type: array
          items:
            type: string
        default:
          $ref: '#/components/schemas/Thumbnail'
    TemplateDraft:
      type: object
      required:
      - draft
      - state
      - mode
      - revision
      - template
      - title
      - conversation
      - knobs
      - set_by
      - declarations
      - latest
      - write
      properties:
        draft:
          $ref: '#/components/schemas/Ulid'
        state:
          $ref: '#/components/schemas/TemplateDraftState'
        mode:
          $ref: '#/components/schemas/DraftMode'
        revision:
          type: integer
          format: int32
          minimum: 0
        template:
          $ref: '#/components/schemas/TemplateAt'
        title:
          type: string
        conversation:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        knobs:
          type: object
          description: The values a person or the agent set, by knob key; every other knob follows its default.
          additionalProperties:
            $ref: '#/components/schemas/KnobValue'
        set_by:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/KnobSetBy'
        declarations:
          type: array
          items:
            $ref: '#/components/schemas/KnobDeclaration'
        latest:
          oneOf:
          - $ref: '#/components/schemas/EvaluationRef'
          - type: 'null'
        write:
          oneOf:
          - $ref: '#/components/schemas/DraftWrite'
          - type: 'null'
    TemplateDraftState:
      type: string
      enum:
      - open
      - writing
      - created
      - updated
      - abandoned
      - expired
    TemplateEvaluation:
      type: object
      required:
      - draft
      - n
      - state
      - mode
      - revision
      - knobs
      - sources
      - template
      - prologue
      - engine
      - census
      - changes_from_template
      - problems
      - notes
      - diff
      - floor
      - axes
      - started_at
      - finished_at
      properties:
        draft:
          $ref: '#/components/schemas/Ulid'
        n:
          $ref: '#/components/schemas/EvaluationNumber'
        state:
          $ref: '#/components/schemas/EvaluationState'
        mode:
          $ref: '#/components/schemas/DraftMode'
        revision:
          type: integer
          format: int32
          minimum: 0
        knobs:
          type: object
          description: Every knob's value once the evaluation has ended, the set values until then.
          additionalProperties:
            $ref: '#/components/schemas/KnobValue'
        sources:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/KnobSource'
        template:
          $ref: '#/components/schemas/TemplateAt'
        prologue:
          oneOf:
          - $ref: '#/components/schemas/EvaluationPrologue'
          - type: 'null'
        engine:
          oneOf:
          - $ref: '#/components/schemas/EvaluationEngine'
          - type: 'null'
        census:
          oneOf:
          - $ref: '#/components/schemas/Census'
          - type: 'null'
        changes_from_template:
          oneOf:
          - $ref: '#/components/schemas/KeyChanges'
          - type: 'null'
        problems:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationProblem'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationNote'
        diff:
          description: Any JSON, or null (shape unclear from code).
        floor:
          oneOf:
          - $ref: '#/components/schemas/FloorRef'
          - type: 'null'
        axes:
          oneOf:
          - $ref: '#/components/schemas/FrameAxes'
          - type: 'null'
        started_at:
          $ref: '#/components/schemas/WallClock'
        finished_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
    TemplateList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCard'
    TextDelta:
      type: object
