  /api/conversations/{conversation}/messages:
    post:
      operationId: agent.admit.message
      tags:
      - Agent
      summary: Send a message to the agent
      description: 'Idempotent write. With no turn open it starts one: the turn row, `message.user` and `turn.started`
        commit together and the turn''s task is spawned. While a turn waits on a question, the message answers it
        in words (`answered` names the question); while it waits on an approval, the message denies it with the
        text as the reason (`denied` names the approval); either way the turn resumes with `turn.resumed`. While
        a turn runs the message is refused. Before that, the conversation must be live and, for a new-site thread,
        the sender''s; the model must be one this process can call and the provider the conversation began with;
        the conversation must still fit the agent after its last attempted compaction; and the process must have
        a free turn permit. A sender in `service_subjects`, or `unattended: true`, makes an unattended turn (no
        browser tab). A replayed answer carries `Idempotent-Replayed: true`.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: conversation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessage'
      responses:
        '202':
          description: The message was taken; its turn is running.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAccepted'
        '400':
          description: '`idempotency-key-missing`: no `Idempotency-Key` header (1 to 255 of A-Z, a-z, 0-9, _ and
            -).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`not-conversation-owner`: the new-site thread is another person''s.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no conversation has that id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`conversation-closed`: the conversation reads as history; `turn-running`: the agent is working;
            `provider-changed`: the conversation began on another provider than the agent now runs; `conversation-too-long`:
            still past `STUDIO_CONVERSATION_MAX_INPUT_TOKENS` after compaction; `idempotency-key-in-flight`: the
            first request under this key has not finished.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: the body does not read as `PostMessage`, `text` is empty, or the body
            exceeds 1 MiB; `idempotency-key-reused`: the key was first sent with another request.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: '`not-built`: the configured transport is Claude on Vertex AI, which is not built.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: '`model-unavailable`: the agent has no usable model (key missing or unconfigured); `agent-busy`:
            the process already runs `STUDIO_TURNS_AT_ONCE` turns (`Retry-After: 60`).'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/conversations/{conversation}/panel-events:
    post:
      operationId: conversations.panel_events.post_event
      tags:
