<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="title desc">
  <title id="title">What a recording is made of</title>
  <desc id="desc">A recording, here one of a run longer than 30 slices, is a scenario block, then a keyframe and the deltas of slices 0 to 29, then a declaration, here of a metric that slice 30 is the first to state (a declaration comes ahead of the first slice or end block that states its metric, whatever the keyframe cadence), then a keyframe and the deltas from slice 30, and, written when the simulation stops, an index, an end block and a trailer. Every block but the index and the trailer is sent live, one websocket message each, the end block last. In the run-object store, under the attempt's live/ folder, the scenario block is scenario.worldview, the keyframe at slice 0 and its deltas are seg-000000.worldview, with the declaration ahead of slice 30 when the server takes it in while that segment is open, the frames from the keyframe at slice 30 are seg-000001.worldview and on, and the end block is in the last segment. The finished file, recording.worldview beside the live/ folder, holds every block in this order.</desc>
  <style>
    svg { font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .bg { fill: #ffffff; stroke: #d5d7da; }
    text { font-size: 14px; fill: #181d27; }
    .b { font-weight: 600; }
    .mu { fill: #535862; }
    .mo { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .on-ink { fill: #ffffff; }
    .bytes-t { fill: #a95b0b; font-weight: 600; }
    .soft { fill: #f7e7d1; stroke: #a95b0b; stroke-width: 1.25; }
    .solid { fill: #a95b0b; stroke: #a95b0b; stroke-width: 1.25; }
    .decl { fill: #ffffff; stroke: #a95b0b; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .grey { fill: #f1f2f4; stroke: #7f848e; stroke-width: 1.25; }
    .tick { fill: #a95b0b; }
    .lead { stroke: #535862; stroke-width: 1.25; }
    .br { fill: none; stroke: #535862; stroke-width: 1.25; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #13161b; stroke: #373a41; }
      text { fill: #f5f5f6; }
      .mu { fill: #a4a7ae; }
      .on-ink { fill: #13161b; }
      .bytes-t { fill: #f0a53a; }
      .soft { fill: #3b2b15; stroke: #f0a53a; }
      .solid { fill: #f0a53a; stroke: #f0a53a; }
      .decl { fill: #13161b; stroke: #f0a53a; }
      .grey { fill: #1b1f26; stroke: #73777f; }
      .tick { fill: #f0a53a; }
      .lead, .br { stroke: #a4a7ae; }
    }
  </style>
  <defs>
    <!-- One tick per slice: the deltas block is 180 wide for 30 slices. -->
    <pattern id="ticks" x="246" y="0" width="6" height="8" patternUnits="userSpaceOnUse"><rect class="tick" x="0" y="0" width="1" height="8"/></pattern>
    <pattern id="ticks-on" x="544" y="0" width="6" height="8" patternUnits="userSpaceOnUse"><rect class="tick" x="0" y="0" width="1" height="8"/></pattern>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="959" height="319" rx="10"/>

  <text class="mu" x="425" y="30" text-anchor="end">here, a declaration of a metric first stated at slice 30</text>
  <line class="lead" x1="439" y1="24" x2="439" y2="62"/>
  <line class="lead" x1="430" y1="24" x2="439" y2="24"/>

  <path class="br" d="M668,58 V48 H944 V58"/>
  <text class="mu" x="806" y="36" text-anchor="middle">written when the simulation stops</text>

  <!-- The frames, in file order -->
  <rect class="soft" x="16" y="64" width="132" height="60" rx="4"/>
  <text class="b" x="82" y="90" text-anchor="middle">Scenario</text>
  <text x="82" y="110" text-anchor="middle">world, config</text>

  <rect class="solid" x="154" y="64" width="86" height="60" rx="4"/>
  <text class="b on-ink" x="197" y="90" text-anchor="middle">Keyframe</text>
  <text class="on-ink" x="197" y="110" text-anchor="middle">slice 0</text>

  <rect class="soft" x="246" y="64" width="180" height="60" rx="4"/>
  <rect x="247" y="65" width="178" height="7" fill="url(#ticks)"/>
  <rect x="247" y="116" width="178" height="7" fill="url(#ticks)"/>
  <text class="b" x="336" y="90" text-anchor="middle">30 deltas</text>
  <text x="336" y="110" text-anchor="middle">slices 0–29</text>

  <rect class="decl" x="432" y="64" width="14" height="60" rx="3"/>

  <rect class="solid" x="452" y="64" width="86" height="60" rx="4"/>
  <text class="b on-ink" x="495" y="90" text-anchor="middle">Keyframe</text>
  <text class="on-ink" x="495" y="110" text-anchor="middle">slice 30</text>

  <rect class="soft" x="544" y="64" width="104" height="60" rx="4"/>
  <rect x="545" y="65" width="102" height="7" fill="url(#ticks-on)"/>
  <rect x="545" y="116" width="102" height="7" fill="url(#ticks-on)"/>
  <text class="b" x="596" y="90" text-anchor="middle">deltas …</text>
  <text x="596" y="110" text-anchor="middle">slices 30–</text>

  <rect class="grey" x="668" y="64" width="88" height="60" rx="4"/>
  <text class="b" x="712" y="90" text-anchor="middle">Index</text>
  <text x="712" y="110" text-anchor="middle">offsets</text>

  <rect class="soft" x="762" y="64" width="100" height="60" rx="4"/>
  <text class="b" x="812" y="90" text-anchor="middle">End block</text>
  <text x="812" y="110" text-anchor="middle">summary</text>

  <rect class="grey" x="868" y="64" width="76" height="60" rx="4"/>
  <text class="b" x="906" y="90" text-anchor="middle">Trailer</text>
  <text x="906" y="110" text-anchor="middle">24 bytes</text>

  <!-- What travels live -->
  <path class="br" d="M16,136 V146 H648 V136"/>
  <text class="bytes-t" x="332" y="168" text-anchor="middle">sent live, one websocket message each</text>
  <text class="mu" x="712" y="168" text-anchor="middle">never sent</text>
  <path class="br" d="M762,136 V146 H862 V136"/>
  <text class="bytes-t" x="812" y="168" text-anchor="middle">sent live, last</text>
  <text class="mu" x="906" y="168" text-anchor="middle">never sent</text>

  <!-- Where the store keeps each part -->
  <text class="mu" x="16" y="204">in the run-object store, under the attempt's live/ folder</text>
  <text class="mu" x="944" y="204" text-anchor="end">the declaration here in seg-000000; after a quiet close, in seg-000001</text>
  <path class="br" d="M16,212 V222 H148 V212"/>
  <text class="mo" x="82" y="244" text-anchor="middle">scenario.worldview</text>
  <path class="br" d="M154,212 V222 H446 V212"/>
  <text class="mo" x="300" y="244" text-anchor="middle">seg-000000.worldview</text>
  <path class="br" d="M452,212 V222 H648 V212"/>
  <text class="mo" x="550" y="244" text-anchor="middle">seg-000001.worldview, …</text>
  <path class="br" d="M762,212 V222 H862 V212"/>
  <text class="mu" x="812" y="244" text-anchor="middle">the last segment</text>

  <!-- The finished file -->
  <path class="br" d="M16,264 V274 H944 V264"/>
  <text x="480" y="298" text-anchor="middle"><tspan class="mu">the finished file, </tspan><tspan class="mo">recording.worldview</tspan><tspan class="mu"> beside live/, holds every block in this order</tspan></text>
</svg>
