        true when no problem is an error. A site that does not resolve, or a world-proto-server that fails, is answered
        as a readiness with `ready: false` and the failure as its one problem (code = the WPS problem type slug,
        for example `pin-unresolved`, or `wps-fault`), never as an HTTP error; only a full compute pool is an error.
