openapi: 3.1.0
info:
  title: Agent Studio API
  version: 0.1.0
  summary: The one door through which a person in the browser and the agent act on Agent Studio's data.
  description: '`studio-api` (`studio/api` in the foundry-studio repository) is the Agent Studio API service: a
    Rust axum

    service over Postgres and world-proto-server. It listens twice.


    **The gate-facing listener** (`STUDIO_BIND`, 3100 by default) serves every `/api/...` route and `GET /healthz`.

    In a cluster only the login gate reaches it; the gate checks the session and forwards the person in four headers

    (`STUDIO_IDENTITY_HEADERS`, by default `x-auth-request-user`, `x-auth-request-email`,

    `x-auth-request-preferred-username`, `x-auth-request-groups`). Every request but `GET /healthz` passes the

    identity layer first: a request naming nobody is refused `identity-missing` (401) before any route runs.

    Locally, `STUDIO_DEV_IDENTITY` stands in for the gate and dev.sh''s Vite server proxies `/api` to it.


    **The runners'' listener** (`STUDIO_RUNNER_BIND`, 3101 by default) serves only the runners'' door, `/runner/v1/...`.

    It reads no identity header; each route is opened by one attempt''s bearer token, which the API minted when
    it

    dispatched that attempt and hands the runner in its environment (`STUDIO_RUNNER_TOKEN`).


    **Refusals.** Every error is `application/problem+json` (RFC 9457) with the `Problem` body: `type` is one slug
    of

    the `ProblemType` vocabulary, `status` repeats the HTTP status, `detail` says what to do, `instance` is the
    request

    path. A busy answer also sets `Retry-After`. A method and path no route serves, including a known path with
    the

    wrong method, answers `not-found` (404). A body or query that does not read answers `validation-failed` (422).

    A fault on the service''s side answers `internal` (500) without its internals.


    **Idempotency.** A write route marked with the `Idempotency-Key` parameter takes that header (1 to 255 of

    `A-Z a-z 0-9 _ -`, fresh per press; the agent loop uses the tool call''s id). The first request under a person''s

    key runs and its answer is stored for 24 hours; a repeat with the same method, route and body gets that answer

    again with `Idempotent-Replayed: true`; a different request under the same key is refused

    `idempotency-key-reused` (422); a repeat while the first still runs is refused `idempotency-key-in-flight`

    (409); a missing key is `idempotency-key-missing` (400). A 5xx answer is not stored, so its retry runs again.


    **Bodies** are limited to 1 MiB. An empty body on a POST that takes JSON reads as `{}`.


    **Clocks.** Every `*_at` field is wall-clock time, RFC 3339 in UTC (`WallClock`). Every `*_sim_ms` field is

    simtime, integer milliseconds from the run''s start. The two are never mixed in one field.


    This document was written from the code on 21 October 2026 (commit cd08e80cf''s master, now `main`). Where the

    code was unclear, a description says so rather than guessing.

    '
servers:
- url: http://127.0.0.1:3100
  description: The gate-facing listener, as dev.sh starts it (its port varies per checkout; dev.sh prints it).
tags:
- name: Identity
  description: Who is asking, and the deployment's health probe.
- name: Conversations
  description: A site's live conversation or a person's new-site thread; its journal, its stream, its messages.
- name: Agent
  description: The agent's turns and the cards it raises (questions, approvals).
- name: Sites
  description: The sites world-proto-server lists, and the scope events the browser follows.
- name: Templates
  description: Site templates and their catalogue.
- name: TemplateDrafts
  description: 'A person''s draft of a new site from a template: knobs, evaluations, and the press that creates
    it.'
- name: Floors
  description: A compiled floor document the browser viewer draws.
- name: Map
  description: The map panel's summary, find and reference resolution.
- name: Flows
  description: A site's flow graph, its parameters and validation.
- name: Drafts
  description: Changeset drafts against world-proto-server, applied or discarded.
- name: Scenarios
  description: Scenarios and their versions (spec 07).
- name: Experiments
  description: What one person's yes would launch, from a scenario version.
- name: Runs
  description: Submission plans, runs, attempts, the queue and cancels (spec 08).
- name: Results
  description: An ended run's metrics, series, inputs, recording and comparisons.
- name: RunnerDoor
  description: The runners' listener, opened per attempt by its token.
- name: Dev
  description: Mounted only with `STUDIO_ENV=local`.
components:
  securitySchemes:
    GateIdentity:
      type: apiKey
      in: header
      name: x-auth-request-user
      description: 'The login gate''s forwarded identity: the stable subject in this header, with the email, display
        name and

        Keycloak roles in the three companion headers `STUDIO_IDENTITY_HEADERS` names. Applies to every gate-facing

        route but `GET /healthz`. Locally `STUDIO_DEV_IDENTITY` supplies it and no header is needed.

        '
    RunnerToken:
      type: http
      scheme: bearer
      description: One attempt's token, 32 random bytes in hex, which opens only that attempt's `/runner/v1` routes.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A key fresh per press, 1 to 255 of `A-Z a-z 0-9 _ -`. See the document's Idempotency section.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,255}$
  headers:
    IdempotentReplayed:
      description: Present, `true`, when this answer is the stored answer of an earlier request under the same key.
      schema:
        type: string
        enum:
        - 'true'
    RetryAfter:
      description: Whole wall-clock seconds to wait before asking again; repeats the body's `retry_after_s`.
      schema:
        type: integer
        minimum: 1
  responses:
    Problem:
      description: A refusal, `application/problem+json`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ActiveTurn:
      type: object
      description: The turn running or waiting as a snapshot is read, with the blocks still streaming.
      required:
      - id
      - n
      - state
      - waiting_on
      - streaming
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        n:
          $ref: '#/components/schemas/TurnNumber'
        state:
          $ref: '#/components/schemas/TurnState'
        waiting_on:
          oneOf:
          - $ref: '#/components/schemas/WaitingOn'
          - type: 'null'
        streaming:
          type: array
          items:
            $ref: '#/components/schemas/StreamingBlock'
    AgentModel:
      type: object
      required:
      - provider
      - model
      properties:
        provider:
          $ref: '#/components/schemas/ModelProvider'
        model:
          type: string
          description: The model's id as the transport names it.
    Aggregation:
      type: string
      enum:
      - additive
      - interval
      - ratio
      - snapshot_gauge
      - distinct_count
    AmendDraft:
      type: object
      description: PATCH /api/drafts/{draft}'s body.
      required:
      - revision
      - ops
      properties:
        revision:
          type: integer
          format: int32
          minimum: 0
          description: The revision the panel last read; must equal the stored one.
        summary:
          type: string
          description: Replaces the stored summary when given.
        ops:
          type: array
          items:
            $ref: '#/components/schemas/ChangesetOp'
    AnswersAccepted:
      type: object
      required:
      - question
      properties:
        question:
          $ref: '#/components/schemas/QuestionRef'
    AppliedPatch:
      description: One patch the runner applied (the `Patch` fields flattened in), with what the field held before
        and the artifact it changed, hashed either side of it.
      allOf:
      - $ref: '#/components/schemas/Patch'
      - type: object
        required:
        - was
        - file
        - sha256_before
        - sha256_after
        properties:
          was: {}
          file:
            type: string
            description: '`world/site.world.json`, `workload.spec` or the run''s `spec.json`.'
          sha256_before:
            type: string
          sha256_after:
            type: string
    AppliedTo:
      type: string
      description: 'Where a patch lands: in the world the runner fetched, or in the workload spec and the run''s
        spec.'
      enum:
      - world
      - spec
    ApprovalAnswer:
      type: object
      description: 202 to `POST /api/runs`, and the approval routes' answer.
      required:
      - approval
      properties:
        approval:
          $ref: '#/components/schemas/ApprovalRecord'
    ApprovalRecord:
      type: object
      required:
      - id
      - conversation
      - tool
      - class
      - via
      - state
      - execution
      - sentence
      - outcome
      - requested_at
      - decided_by
      - decided_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        conversation:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        tool:
          type: string
          description: '`site.create_from_template` for Create site.'
        class:
          type: string
        via:
          $ref: '#/components/schemas/ApprovalVia'
        state:
          $ref: '#/components/schemas/ApprovalState'
        execution:
          oneOf:
          - $ref: '#/components/schemas/Execution'
          - type: 'null'
        sentence:
          type:
          - string
          - 'null'
          description: The sentence of a failed or unknown execution.
        outcome:
          description: What the act answered once it ended (any JSON; a `SiteMade` for Create site), or null.
        requested_at:
          $ref: '#/components/schemas/WallClock'
        decided_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        decided_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
    ApprovalState:
      type: string
      enum:
      - pending
      - approved
      - denied
      - expired
    ApprovalVia:
      type: string
      description: 'How an approval was given: on the agent''s card, or by a person''s own press in a panel.'
      enum:
      - card
      - button
    AttemptControl:
      type: object
      description: Live attempt-row control, separate from the attempt's immutable pins. A process signal is never a cancellation request.
      properties:
        cancel_requested:
          type: boolean
      required:
      - cancel_requested
    AttemptNumber:
      type: integer
      format: int32
      minimum: 1
      description: An attempt's number within its run, from 1.
    AttemptRead:
      type: object
      description: One attempt of a run, and what its manifest said once it arrived.
      required:
      - n
      - state
      - requested_at
      - findings
      - stalled
      properties:
        n:
          $ref: '#/components/schemas/AttemptNumber'
        state:
          $ref: '#/components/schemas/RunState'
        requested_at:
          $ref: '#/components/schemas/WallClock'
        dispatched_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
        started_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
        ended_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
        job:
          type:
          - string
          - 'null'
        job_stopped_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
        streaming_server:
          description: The streaming server the dispatcher pointed the attempt at (ruling D174); absent when it runs
            unstreamed.
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        runner_commit:
          type:
          - string
          - 'null'
        runner_dirty:
          type:
          - boolean
          - 'null'
        ended_by:
          oneOf:
          - $ref: '#/components/schemas/EndedBy'
          - type: 'null'
        stop_reason:
          type:
          - string
          - 'null'
        stop_detail:
          type:
          - string
          - 'null'
        heartbeat_at:
          description: When the runner was last heard; its latest heartbeat, every 5 s of wall clock while it runs.
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
        platform_status:
          description: 'The platform''s view of the attempt''s Job as the reconciler last heard it, in words: `pending:
            ImagePullBackOff`, `running`, `ended: DeadlineExceeded`.'
          type:
          - string
          - 'null'
        stalled:
          description: A running attempt whose heartbeat is older than 30 s of wall clock; read off the row, it ends
            nothing.
          type: boolean
        compile:
          oneOf:
          - $ref: '#/components/schemas/CompiledRead'
          - type: 'null'
        exact:
          type:
          - boolean
          - 'null'
        exact_reason:
          type:
          - string
          - 'null'
        walked:
          type:
          - string
          - 'null'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        stub:
          type:
          - boolean
          - 'null'
    BlockId:
      type: string
      description: A text block of a turn, as `text.delta`, `text.done` and `turn.finished` name it.
    BranchName:
      type: string
      description: A branch's name, a slug that is never all digits and never `head`.
    ByteCount:
      type: integer
      format: int64
      minimum: 0
      description: A size in bytes.
    CallId:
      type: string
      description: A tool call, by the ULID the API mints for it.
    CallRead:
      type: object
      description: One call as the turn's details read it; `result` is trimmed to 4 KiB of JSON text and null while
        the call runs.
      required:
      - call
      - tool
      - input
      - result
      - outcome
      - summary
      properties:
        call:
          $ref: '#/components/schemas/CallId'
        tool:
          type: string
        input: {}
        result: {}
        outcome:
          $ref: '#/components/schemas/CallState'
        summary:
          type: string
    CallState:
      type: string
      enum:
      - running
      - waiting
      - ok
      - failed
      - denied
      - stopped
      - interrupted
      description: A tool call's state; `waiting` while an approval it asked for waits.
    CancelAnswer:
      type: object
      description: 202 to `POST /api/runs/{run}/cancel`.
      required:
      - outcome
      - state
      properties:
        outcome:
          $ref: '#/components/schemas/CancelOutcome'
        state:
          $ref: '#/components/schemas/RunState'
    CancelOutcome:
      type: string
      description: What a cancel actually did.
      enum:
      - cancelled
      - stopping
      - already-ended
    Census:
      type: object
      description: 'What an evaluation made: instances per count knob, made entities per component, derived entities
        per component.'
      required:
      - by_knob
      - declared
      - derived
      properties:
        by_knob:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        declared:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        derived:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    ChangesetOp:
      type: object
      description: 'One operation of a draft, tagged by `op`. Only `patch` exists: one field of one flow entity
        or map sector set to `value`, the pointer opening with the component''s name (`/flow.node/intake/0/admission_factor`;
        a `/sector...` pointer writes the map).'
      required:
      - op
      - target
      - pointer
      - value
      properties:
        op:
          type: string
          enum:
          - patch
        target:
          $ref: '#/components/schemas/EntityId'
        pointer:
          type: string
        value:
          description: Any JSON.
      discriminator:
        propertyName: op
    ChangesetPart:
      type: object
      description: How many operations a draft holds for one scope it writes.
      required:
      - scope
      - ops
      properties:
        scope:
          $ref: '#/components/schemas/ScopePath'
        ops:
          type: integer
          format: int32
          minimum: 0
    Clock:
      type: string
      enum:
      - sim
      - scheduler
      - wall
      description: 'The clock a value counts in: simtime, scheduler time (the order things are booked), or the wall
        clock.'
    CompareReply:
      type: object
      description: The inputs that differ first, then what is the same, then results, each measured against `reference`.
      required:
      - runs
      - differs
      - same
      - not_compared
      - reference
      - metrics
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ComparedRun'
        differs:
          type: array
          items:
            $ref: '#/components/schemas/InputField'
        same:
          type: array
          items:
            $ref: '#/components/schemas/SameField'
        not_compared:
          type: array
          items:
            $ref: '#/components/schemas/NotCompared'
        reference:
          $ref: '#/components/schemas/Ulid'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ComparedMetric'
    ComparedMetric:
      type: object
      description: 'One metric across the compared runs: combined only when every run reports it over one window
        with one unit, clock, aggregation and denominator, else not comparable, `reason` saying why.'
      required:
      - metric
      - label
      - unit
      - aggregation
      - comparable
      - values
      properties:
        metric:
          type: string
        label:
          type: string
        unit:
          $ref: '#/components/schemas/MetricUnit'
        clock:
          $ref: '#/components/schemas/DurationClock'
        aggregation:
          $ref: '#/components/schemas/Aggregation'
        comparable:
          type: boolean
        reason:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/ComparedValue'
    ComparedRun:
      type: object
      description: A compared run, and whether its attempt's numbers are the stub runner's canned ones.
      required:
      - id
      - label
      - state
      - attempt
      - stub
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        label:
          type: string
        state:
          $ref: '#/components/schemas/RunState'
        attempt:
          $ref: '#/components/schemas/AttemptNumber'
        stub:
          type: boolean
    ComparedValue:
      type: object
      description: One run's value of a compared metric and the window it covers; a run without the metric has a
        null value and an all-zero window.
      required:
      - run
      - value
      - window
      properties:
        run:
          $ref: '#/components/schemas/Ulid'
        value:
          type:
          - number
          - 'null'
        window:
          $ref: '#/components/schemas/SimWindow'
    CompileRead:
      type: object
      description: The plan the runner compiled, against the expectation it read with its pins.
      required:
      - v
      - compiler
      - digest
      - expected
      - differs
      properties:
        v:
          $ref: '#/components/schemas/FileFormat'
        compiler:
          type: string
        digest:
          type:
          - string
          - 'null'
        expected:
          $ref: '#/components/schemas/Expectation'
        differs:
          type: array
          items:
            $ref: '#/components/schemas/FindingPart'
    CompiledRead:
      type: object
      description: The plan the attempt's runner compiled.
      required:
      - digest
      - compiler
      properties:
        digest:
          type:
          - string
          - 'null'
        compiler:
          type: string
    ContextPanel:
      type: string
      enum:
      - home
      - templates
      - template
      - map
      - flow
      - history
      - scenario
      - runs
    ContextSelection:
      type: object
      required:
      - key
      - label
      properties:
        key:
          $ref: '#/components/schemas/Key'
        label:
          type: string
    Conversation:
      type: object
      description: A conversation as the API answers it. `site` is null for a new-site thread until Create site
        binds it; `last_seq` is `first_seq - 1` while it holds no entries.
      required:
      - id
      - project
      - site
      - state
      - title
      - created_by
      - created_at
      - bound_at
      - ended_at
      - ended_by
      - first_seq
      - last_seq
      - model_label
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        project:
          $ref: '#/components/schemas/Ulid'
        site:
          oneOf:
          - $ref: '#/components/schemas/SitePath'
          - type: 'null'
        state:
          $ref: '#/components/schemas/ConversationState'
        title:
          type:
          - string
          - 'null'
          description: The site's name once a new-site thread binds; null for a conversation a site route opened.
        created_by:
          $ref: '#/components/schemas/Subject'
        created_at:
          $ref: '#/components/schemas/WallClock'
        bound_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
        ended_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
        ended_by:
          oneOf:
          - $ref: '#/components/schemas/Subject'
          - type: 'null'
        first_seq:
          $ref: '#/components/schemas/JournalSeq'
        last_seq:
          $ref: '#/components/schemas/JournalSeq'
        model_label:
          type: string
          description: The model's name as the chat header shows it.
    ConversationList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
        next:
          description: Present when more remain; the `before` that reads the next page.
          oneOf:
          - $ref: '#/components/schemas/JournalSeq'
          - type: 'null'
    ConversationState:
      type: string
      enum:
      - live
      - archived
      - discarded
      description: '`live` takes entries; Dismiss leaves a site''s conversation `archived` and a new-site thread
        `discarded`.'
    ConversationSummary:
      description: 'One row of `GET /api/conversations`: the conversation''s fields flattened, what its open turn
        waits on, and the wall-clock times of its first and last entries (null while it holds none).'
      allOf:
      - $ref: '#/components/schemas/Conversation'
      - type: object
        required:
        - waiting
        - first_at
        - last_at
        properties:
          waiting:
            oneOf:
            - $ref: '#/components/schemas/WaitingOn'
            - type: 'null'
          first_at:
            oneOf:
            - $ref: '#/components/schemas/WallClock'
            - type: 'null'
          last_at:
            oneOf:
            - $ref: '#/components/schemas/WallClock'
            - type: 'null'
    CountRow:
      type: object
      description: 'One row of "What the site holds": the entities carrying exactly this set of components.'
      required:
      - label
      - components
      - count
      properties:
        label:
          type: string
        components:
          type: array
          items:
            type: string
        count:
          $ref: '#/components/schemas/EntityCount'
    CreateScenario:
      type: object
      additionalProperties: false
      description: '`POST /api/scenarios`''s body: a group left out takes section 3.2''s stated defaults.'
      required:
      - name
      - site_scope
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: 1 to 120 characters after trimming; unique on the site.
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: At most 2,000 characters; empty when left out.
        site_scope:
          $ref: '#/components/schemas/SitePath'
        workload:
          oneOf:
          - $ref: '#/components/schemas/Workload'
          - type: 'null'
        run_controls:
          oneOf:
          - $ref: '#/components/schemas/RunControls'
          - type: 'null'
    CreateSite:
      type: object
      description: '`POST /api/template-drafts/{d}/site` body. Unknown fields are refused.'
      additionalProperties: false
      required:
      - customer
      - slug
      - name
      - evaluation
      properties:
        customer:
          type: string
          description: The new site's customer slug.
        slug:
          type: string
          description: The new site's slug; the site is `customer/{customer}/site/{slug}`.
        name:
          type: string
          description: The site's name; trimmed, must not be empty.
        evaluation:
          $ref: '#/components/schemas/EvaluationNumber'
        browser_tab:
          type:
          - string
          - 'null'
          description: Not read by the handler.
        context:
          description: Any JSON; not read by the handler.
    CreatedScenario:
      type: object
      required:
      - scenario
      - version
      - revision
      properties:
        scenario:
          $ref: '#/components/schemas/Ulid'
        version:
          $ref: '#/components/schemas/VersionNumber'
        revision:
          $ref: '#/components/schemas/Revision'
    Decision:
      type: string
      enum:
      - approve
      - deny
    DeclaredMetric:
      type: object
