# AUTO-GENERATED by sync-to-simulator.sh — do not edit manually
[workspace]
resolver = "3"
members = [
    "sim/desgraph",
    "sim/desmap",
    "sim/dessim",
    "sim/dessim-trace-macros",
    "sim/dessim-stream-macros",
    "sim/dessim-task-macros",
    # Hand-added, all four: `sync-to-simulator.sh` lives in the other tree and
    # knows none of them yet, so a regeneration would drop every one.
    "sim/desunits",
    "sim/pathfinder",
    "worldview/worldview",
    "worldview/worldview-render",
    "worldview/worldview-floor",
    "workbook",
    "desvis",
    "native-modules",
    "studio/world-lenses",
    "studio/world-tools",
    "studio/runs",
    "studio/viewer",
    "runstore",
    "studio/api",
    "studio/protocol",
    "studio/wps-client",
    "studio/site-template",
    "studio/scenario-spec",
    # Agent Studio's new crates, at their places in ruling D118's layout from the start.
    "studio/run-invocation",
    "studio/simrunner",
    "studio/kube-invoker",
    "studio/agent-loop",
    "studio/streaming",
    "studio/metrics",
]
# `sim/site-model` (the warehouse site model) is a workspace of its own.
# dessim depends on the site model by path, and cargo refuses a path dependency on
# a directory it would otherwise read as a second root of this workspace, so
# the subtree is named here as not-a-member. (Hand-added on top of the
# generated members list; sync-to-simulator.sh needs to learn it.)
exclude = ["sim/site-model"]
# What a bare `cargo build`, `cargo test` or `cargo clippy` at the root builds: every member but Agent Studio's own
# crates, which build when named with `-p`, as dev.sh names them. So a simulator build compiles none of the product,
# and no product crate's dependency features (serde_json's among them) reach the simulator's dependencies.
# (Hand-added; sync-to-simulator.sh needs to learn it too.)
default-members = [
    "sim/desgraph",
    "sim/desmap",
    "sim/dessim",
    "sim/dessim-trace-macros",
    "sim/dessim-stream-macros",
    "sim/dessim-task-macros",
    "sim/desunits",
    "sim/pathfinder",
    "worldview/worldview",
    "worldview/worldview-render",
    "worldview/worldview-floor",
    "workbook",
    "desvis",
    "native-modules",
    "studio/runs",
    "studio/viewer",
    "runstore",
]

# The API dev.sh builds and runs, with simrunner, which it starts (`cargo build --profile studio-dev`): every library
# optimised, since a template evaluation spends its wall clock in foundry's reader, the flow compiler and the floor
# compile, and studio-api itself not, so an edit to it rebuilds as fast as in `dev`. Its artifacts sit in their own
# folder of the target directory, so `dev` builds and tests are untouched.
[profile.studio-dev]
inherits = "dev"
opt-level = 2

[profile.studio-dev.package.studio-api]
opt-level = 0

# Dependencies optimised in dev and test builds, workspace crates not: the test
# gate's wall time was a document load repeated in every DFW6 test, and that
# load spends its 28 s (opt-level 0) in site-model, worldprotocol-core,
# serde_json, sha1 and uuid comparisons, none of them a crate edited here; at
# opt-level 3 it takes 3 s. A workspace crate still compiles as fast as before.
# (Hand-added; sync-to-simulator.sh needs to learn it.)
[profile.dev.package."*"]
opt-level = 3
