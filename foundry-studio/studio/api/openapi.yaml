          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Problem type `scenario-changed`: `version` is not the latest (`conflicts` holds the latest
            version''s value of each set pointer), or a field overlapping a set pointer changed after `revision`
            (`conflicts` lists each such field with its value and `set_by`); the edit was not saved. `scenario-deleted`:
            the scenario was deleted, nothing edits it. `name-taken`: `/name` is already used by another scenario
            on the site (`problems[0].ref` names it when it still exists).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Problem type `validation-failed`: the body does not read; `/set` is empty; `/revision` is
            past the latest revision; `/name` or `/description` is not text or out of length; a pointer is no field
            of a scenario; a value does not read as its field''s type; or the merged content fails a section 3.2
            check (each finding in `problems` with code `validation-failed` and `field`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
