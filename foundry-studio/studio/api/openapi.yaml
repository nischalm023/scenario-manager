        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          description: Problem type `not-found` (no run has that id, or the path is not a ULID).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/{run}/cancel:
    post:
      operationId: runs.cancel_run
      tags:
      - Runs
      summary: Cancel a run
      description: 'Cancels the run''s latest attempt and answers what was actually done (spec 08 section 3.6; it
        never asks).

        A queued attempt, with or without a Job, is `cancelled`; a running one is asked to stop (`stopping`, state

        stays `running` until its runner confirms or the grace passes); an ended one is `already-ended` with its

        state. No body is required.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: run
        in: path
        required: true
        description: The run's ULID.
        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '202':
          description: What the cancel did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAnswer'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          description: Problem type `idempotency-key-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem type `not-found` (no run has that id).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem type `idempotency-key-in-flight`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem types `idempotency-key-reused` or `validation-failed` (body over 1 MiB).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/{run}/inputs:
    get:
      tags:
      - Results
      operationId: results.inputs
      summary: The run's inputs as values, then their provenance
      description: 'Every scenario field of the field catalogue as the run read it (a sweep''s value, a repeat''s
        seed and an

        experiment''s override each marked by where it came from, with the scenario''s own value in `held` where
        the

        run read another), any world target the sweep patched (a flow parameter or a fleet figure), then the

        provenance rows: the scenario version, every scope read with its changeset, the read''s exactness, the

        generated workload, the compiled flow plan, the compiler, whether the plan differs from the check, the

        runner''s image and the runner''s commit. Each row carries its value unrounded as RFC 8785 canonical JSON

        beside its words. Read from the run''s latest attempt. Flow parameters, class figures, the map census and

        the settings the runner resolved are not read yet, so every answer says `complete: false`.

        With `format=text` the same rows are answered as plain lines (the `text` field alone) for a copy.

        '
      parameters:
      - name: run
        in: path
        required: true
        description: The run's id (ULID). An id that does not parse answers 404 `not-found`.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: format
        in: query
        required: false
        description: '`json` (the default) answers `RunInputs`; `text` answers its `text` field as `text/plain`.'
        schema:
          type: string
          enum:
          - json
          - text
          default: json
      responses:
        '200':
          description: The run's inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInputs'
            text/plain; charset=utf-8:
              schema:
                type: string
                description: The inputs as plain lines, the same as `RunInputs.text` (when `format=text`).
        '401':
          description: Problem `identity-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `not-found`; no run has that id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem `validation-failed`; the query does not parse, or `format` is neither `json` nor
            `text`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal` (the run's experiment, scenario or version is gone, or storage failed).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/{run}/manifest:
    get:
      operationId: runs.manifest
      tags:
      - Runs
      summary: Read an attempt's manifest
      description: 'The manifest exactly as the attempt''s runner handed it in (the stored bytes, served as `application/json`),

        the latest attempt''s by default or the one `attempt` names. Before it arrives the answer is `not-fetched`.

        '
      parameters:
      - name: run
        in: path
        required: true
        description: The run's ULID.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: attempt
        in: query
        required: false
        description: The attempt number; the latest attempt when absent.
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: The manifest as handed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '404':
          description: Problem type `not-found` (no run has that id, or no such attempt).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem type `not-fetched` (the attempt's runner has not handed in its manifest yet).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem type `validation-failed` (the query does not read).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/{run}/metrics:
    get:
      tags:
      - Results
      operationId: results.metrics
      summary: Every metric an attempt declared, over a window of simtime, with the run's headline metrics
      description: 'Answers every metric the attempt declared, in descriptor order, each valued over one window
        of simtime.

        The attempt is the latest unless `attempt` names one. The window is the run''s report window as far as the

        attempt got (its end clamped to how far the attempt reached, so an attempt that stopped early still shows

        what it reached) unless the request names `from_sim_ms` and/or `to_sim_ms`; a missing `from_sim_ms` is the

        run''s start (0) and a missing `to_sim_ms` is the run''s end. Both window ends must be instants the recording

        holds values for (the run''s start, every slice end any series names, and the run''s end), else the request

        is refused with a `window-not-recorded` item naming the nearest recorded instants; a window with no span
        is

        refused too. An additive metric is valued as the difference of its running values at the window''s ends

        (`basis: window_difference`); every other class answers its whole-run value marked by the whole run''s

        window. A value the run never stated is null, never 0.


        `headlines` names the run''s headline metrics in order: the project''s pinned metrics that the run declared,

        else the metrics of the Runs panel `show` command whose journal entry `highlights` names, else the first

        four the run declared. An attempt that declared no metric yet (queued, running, or ended before storing

        any) answers empty `items` and `headlines` over the whole run.

        '
      parameters:
      - name: run
        in: path
        required: true
        description: The run's id (ULID). An id that does not parse answers 404 `not-found`.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: attempt
        in: query
        required: false
        description: The attempt whose values are read; the run's latest when absent.
        schema:
          $ref: '#/components/schemas/AttemptNumber'
      - name: from_sim_ms
        in: query
        required: false
        description: The window's start, milliseconds of simtime; must be a recorded instant. Default is the report
          window's start, or 0 when only `to_sim_ms` is given.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: to_sim_ms
        in: query
        required: false
        description: The window's end, milliseconds of simtime; must be a recorded instant. Default is the report
          window's end as far as the attempt got, or the run's end when only `from_sim_ms` is given.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: highlights
        in: query
        required: false
        description: The site journal sequence number of the Runs panel `show` command whose metrics headline where
          the project pins none.
        schema:
          $ref: '#/components/schemas/JournalSeq'
      responses:
        '200':
          description: The attempt's metrics over the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsReply'
        '401':
          description: Problem `identity-missing` (the gate's identity layer, every route).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `not-found`; no run has that id (or it does not parse), or the run has no attempt
            / no attempt numbered `attempt`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem `validation-failed`; the query does not parse, the window holds no span, or a window
            end falls between recorded instants (item code `window-not-recorded`, `field` one of `from_sim_ms`,
            `to_sim_ms` or `report_window`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/{run}/recording:
    get:
      tags:
      - Results
      operationId: results.recording
      summary: The attempt's stored `.worldview` recording as a download
      description: 'The bytes of the attempt''s stored recording (the latest attempt unless `attempt` names one),
        as an

        attachment. The file name is "{scenario} - {site} - {variant} - {date}.worldview": the scenario''s name;
        the

        site''s name as its root''s prologue states it, else the last segment of its root path; the run''s label

        with the "{scenario}, " prefix removed, omitted when nothing remains; and the date (UTC, `YYYY-MM-DD`) the

        attempt started (its request time when it never started). When the attempt''s manifest marks it a stub,
        " -

        canned by the stub runner" is added before ".worldview". Slashes, backslashes and control characters in
        the

        name become "-". The header is `Content-Disposition: attachment; filename="<ascii>"; filename*=UTF-8''''<rfc5987>`

        where `filename` has every non-ASCII character and double quote replaced by "_" and `filename*` is the

        RFC 5987 percent-encoding of the full name.

        '
      parameters:
      - name: run
        in: path
        required: true
        description: The run's id (ULID). An id that does not parse answers 404 `not-found`.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: attempt
        in: query
        required: false
        description: The attempt whose recording is downloaded; the run's latest when absent.
        schema:
          $ref: '#/components/schemas/AttemptNumber'
      responses:
        '200':
          description: The recording's bytes.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<ascii name>"; filename*=UTF-8''<percent-encoded name>` (see
                the operation description for the name rule).'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: A `.worldview` recording file.
        '401':
          description: Problem `identity-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `not-found`; no run has that id, or the run has no such attempt.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem `no-recording`; the attempt stored no recording, so it has none to give.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem `validation-failed`; the query does not parse.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal` (storage or manifest read failed).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/{run}/series:
    get:
      tags:
      - Results
      operationId: results.series
      summary: One metric by simulated period from the run's start
      description: 'One metric of one attempt (the latest unless `attempt` names one) as a series. An additive metric
        whose

        stored series is running values is cut into periods of `period_sim_ms` (an hour of simtime by default) from

        the run''s start, the last period ending at the run''s end, which may cut it short; every period boundary

        must be an instant the recording holds values for, else the request is refused with a

        `window-not-recorded` item. The answer is then `kind: per_period` with `period_sim_ms` set, and each

        period''s value is the running value at its end less at its start. Any other class (or an additive metric

        stored as readings) answers `kind: readings`: one point per slice that stated one, never thinned, with

        `from_sim_ms` equal to `to_sim_ms`; an accumulating class stored as running values answers each slice''s

        increase. `window` is the run''s report window as far as the attempt got, which a chart shades outside.

        '
      parameters:
      - name: run
        in: path
        required: true
        description: The run's id (ULID). An id that does not parse answers 404 `not-found`.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: metric
        in: query
        required: true
        description: The name of the metric whose series is asked for. Absent or empty answers 422 `validation-failed`.
        schema:
          type: string
          minLength: 1
      - name: attempt
        in: query
        required: false
        description: The attempt whose values are read; the run's latest when absent.
        schema:
          $ref: '#/components/schemas/AttemptNumber'
      - name: period_sim_ms
        in: query
        required: false
        description: The period an additive metric is cut into, milliseconds of simtime; must be greater than 0.
          Ignored for a metric answered as readings.
        schema:
          type: integer
          format: int64
          minimum: 1
          default: 3600000
      responses:
        '200':
          description: The metric's series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesReply'
        '401':
          description: Problem `identity-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `not-found`; no run has that id, the run has no such attempt, or the attempt declared
            no metric named `metric`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem `no-recording`; the attempt stored no series and no recording.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem `validation-failed`; the query does not parse, `metric` is missing or empty, `period_sim_ms`
            is 0, or a period boundary falls between recorded instants (item code `window-not-recorded`, `field`
            `period_sim_ms`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/{run}/watch:
    post:
      operationId: runs.watch
      tags:
      - Runs
      summary: A ticket to watch a run live
      description: 'Mints a ticket for the run''s latest attempt on the streaming server that holds its stream
        (ruling D174): the one that last wrote its figures, else the one the dispatcher pointed it at. The viewer opens `url`, the server''s external port, and sends `{"type":"watch","v":1,"token":...}`
        as its first message; the server admits it by the token''s SHA-256 for a minute of wall clock, then sends
        `attached`, the stream so far and its messages live (`studio/streaming/README.md` has the wire). Each ask
        mints a ticket of its own; minting deletes the expired ones. No body is required.

        '
      parameters:
      - name: run
        in: path
        required: true
        description: The run's ULID.
        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchTicket'
        '404':
          description: Problem type `not-found` (no run has that id).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem type `not-streamed`; the latest attempt was never pointed at a streaming server, or its
            server's heartbeat is stale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/scenario-fields:
    get:
      operationId: scenarios.fields
      tags:
      - Scenarios
      summary: The field catalogue
      description: 'The static catalogue naming each scenario field once (spec 07 section 3.2): its pointer, label
        and short label, unit, the stored value of one shown unit, its clock, whether a sweep may vary it, a closed
        field''s options with whether this build''s runner image accepts each, and a hint. Every surface names a
        field by it. Fields in order: `/workload/generator/{orders_per_hour, lines_per_order, sku_count, inventory_fill_pct,
        units_per_stored_tote, release, wave_every_sim_ms, seed}`, `/workload/order_trays`, `/run_controls/{duration_sim_ms,
        seed, floor_traffic}`, `/run_controls/report_window/{from_sim_ms, to_sim_ms, before_name}`.'
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldCatalogue'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`: a fault on the service side, logged in full and answered without its internals.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no route serves this path, or the object named does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/scenarios:
    post:
      operationId: scenarios.create
      tags:
      - Scenarios
      summary: Create a scenario
      description: 'Creates a scenario at version 1, open at revision 1, on a site that world-proto-server lists.
        Every field of the content is stated: a `workload` or `run_controls` group the body leaves out takes the
        stated defaults (300 orders an hour, 3 lines an order, 400 SKUs, 80 % fill, 1 unit a stored tote, release
        all at the start, generator seed 0, 0 order trays; 4 h of simtime, simulation seed 0, reserved cells, report
        window from 0 to the end, excluded start named "warm-up"). Every field is recorded as set by the caller
        at revision 1. The name is 1 to 120 characters after trimming and unique on its site; the description is
        at most 2,000 characters. An empty body reads as `{}`. Idempotent under an `Idempotency-Key`.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenario'
      responses:
        '201':
          description: The scenario was made.
