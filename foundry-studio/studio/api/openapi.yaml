                $ref: '#/components/schemas/Problem'
        '502':
          description: 'world-proto-server failure mapped by the client: `wps-fault`, `wps-outcome-unknown`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'world-proto-server failure mapped by the client: `wps-unavailable`, `compute-busy` (with
            `Retry-After`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/floors/{key}:
    get:
      tags:
      - Floors
      operationId: floors.floor
      summary: A floor document by its key
      description: 'The one floor document a browser draws, `{ floor_version, floor, roll }` as MessagePack, immutable
        under its key (one key never holds two floors; answered with `Cache-Control: public, max-age=31536000, immutable`).
        A site''s key is `{document-sha256}.{compiler}` as `MapSummary.floor.key` names it, served from the floor
        cache or compiled again from the cut the key was minted for in this process. A template evaluation''s floor
        is `template-drafts/{draft}/{n}/floor.msgpack` and a template thumbnail''s `template-thumbnails/{row}/floor.msgpack`,
        read from the run-object store.'
      parameters:
      - name: key
        in: path
        required: true
        description: 'Axum wildcard (`{*key}`): the rest of the path, slashes included. Either a site floor key
          (`{hex sha256}.floor{version}@{build}[.{draft digest}]`) or a kept-floor store key (`template-drafts/{ulid}/{n}/floor.msgpack`,
          `template-thumbnails/{ulid}/floor.msgpack`).'
        schema:
          type: string
      responses:
        '200':
          description: The floor document.
          headers:
