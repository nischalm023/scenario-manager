      summary: Tell the agent of a panel's own act
      description: Idempotent write. Journals the body as it came as a `panel.event` entry, which starts no turn
        and which the next turn reads with its message. `text` is 1 to 2,000 characters for the agent to read; `body`
        must be a JSON object of the kind's own fields.
      parameters:
