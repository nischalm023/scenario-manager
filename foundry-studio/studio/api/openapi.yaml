      - duration_sim_ms
      - report_window
      - variant
      - expected
      properties:
        run:
          $ref: '#/components/schemas/Ulid'
        position:
          $ref: '#/components/schemas/RunPosition'
        seed:
          $ref: '#/components/schemas/Seed'
        duration_sim_ms:
          type: integer
          format: int64
          description: The run's duration in simtime milliseconds.
        report_window:
          $ref: '#/components/schemas/ReportWindow'
        variant:
          type: array
          items:
            $ref: '#/components/schemas/Patch'
        expected:
          $ref: '#/components/schemas/Expectation'
    PostAnswers:
      type: object
      required:
      - answers
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ItemAnswer'
    PostDecision:
      type: object
      description: '`POST /api/approvals/{a}/decision`''s body; `reason` is kept only with a denial.'
      required:
      - decision
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        reason:
          type:
          - string
          - 'null'
    PostMessage:
      type: object
      description: '`POST /api/conversations/{c}/messages`''s body.'
