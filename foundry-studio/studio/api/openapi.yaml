        version:
          $ref: '#/components/schemas/VersionNumber'
        revision:
          $ref: '#/components/schemas/Revision'
    Pins:
      type: object
      description: Answer of `GET /runner/v1/attempts/{run}/{n}`; everything one attempt must read, all fixed before
        anyone approved it.
