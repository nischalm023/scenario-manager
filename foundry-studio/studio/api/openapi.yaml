        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        required: false
        description: Page size; clamped to 1..500.
        schema:
          type: integer
          default: 200
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
