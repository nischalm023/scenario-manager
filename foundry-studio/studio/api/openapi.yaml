          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no route serves this path, or the object named does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
    post:
      operationId: drafts.create
      tags:
      - Drafts
      summary: Make the caller's draft on a site at the cut their panel read
      description: 'A draft is made by its first edit: the body names the site (a location; without a pin it is
        read at `@main`), the changeset each scope was read at (`seqs`), a summary and at least one operation. The
        caller may hold only one open or applying draft per site. The site''s scopes are resolved at the pin; a
        scope whose head is not the `seqs` the panel read refuses `head-moved` (a draft never adopts a newer head).
        The operations are folded, the would-be site is built, checked by the world store''s client and compiled
        in validation mode; the draft is stored `ready` when no problem is an error, else `drafting`, and a `flow.draft_changed`
        panel event goes to the site''s live conversation. Takes an `Idempotency-Key`.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDraft'
      responses:
        '201':
          description: The draft at revision 1, checked.
          content:
