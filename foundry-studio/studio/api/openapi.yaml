  /api/conversations/{conversation}/stream:
    get:
      operationId: journal.stream
      tags:
      - Conversations
      summary: A conversation's server-sent events
      description: 'A `text/event-stream` of the conversation. The cursor is the `Last-Event-ID` header when the
        browser sends one, else `?after=`; with neither, the replay starts at the conversation''s first entry. The
        connection first sends a `retry: 2000` line, then replays every journaled entry after the cursor (in batches
        of 500), then each block still streaming as one `text.delta` from offset 0, then `stream.live`, then tails
        the journal and the hub. Events: a journaled entry is sent as `id: <seq>`, `event: <kind>` (one of `JournalKind`''s
        wire names) and `data:` holding a `JournalEntry`; the live-only items carry no `id:` line: `text.delta`
        (`TextDelta`), `run.progress` and `template.evaluation` (a `LiveItem`''s `body`, owned by specs 08 and 05
        respectively, sent as the raw body value), `stream.live` (`StreamLive`, once per connection), `ping` (`Ping`,
        every 15 s of wall clock) and `stream.reset` (`StreamReset`), after which the stream ends: `unknown-cursor`
        when the cursor is past the conversation''s `last_seq`, `slow-client` when the client fell more than 1,000
        hub items behind. The response carries `X-Accel-Buffering: no`.'
      parameters:
      - name: conversation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: after
        in: query
        required: false
        description: Journal number to resume after, used only when no `Last-Event-ID` header is sent.
        schema:
          type: integer
          minimum: 0
      - name: Last-Event-ID
        in: header
        required: false
        description: The last journal number the browser received; takes precedence over `after`. Blank is ignored.
        schema:
          type: string
      responses:
        '200':
          description: The event stream.
          headers:
            X-Accel-Buffering:
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames. `data:` of a journaled entry is a `JournalEntry`; of `text.delta` a `TextDelta`;
                  of `stream.live` a `StreamLive`; of `ping` a `Ping`; of `stream.reset` a `StreamReset`; of `run.progress`/`template.evaluation`
                  an owner-defined JSON value.
        '401':
          description: '`identity-missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no conversation has that id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: `Last-Event-ID` is no journal number or not text, or `after` does not
            read.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/dev/conversations/{conversation}/entries:
    post:
      operationId: dev.write
      tags:
      - Dev
      summary: Test writer, local only
      description: 'Mounted only when `STUDIO_ENV=local`; a cluster never mounts it. A body with a `live` field
        is a `DevLive`: the live item goes to the hub alone and the answer is `202` with no body (the conversation
        must exist and be live). Any other body is a `DevEntry`: the entry''s body must read as its kind''s, the
        turn-row change the agent loop would make with it is made (`agent::follow`), and it is appended to the journal:
        `201` with the entry written, or `200` naming the entry whose `dedup_key` it repeated, nothing written.'
      parameters:
      - name: conversation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevWrite'
      responses:
        '200':
          description: The entry's dedup key was already held; nothing was written. Body is `DevWritten`'s `Held`
            form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevWritten'
        '201':
          description: The entry was written. Body is `DevWritten`'s `Wrote` form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevWritten'
        '202':
          description: The live item was handed to the hub. No body.
        '401':
          description: '`identity-missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no conversation has that id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`conversation-closed`: the conversation is archived or discarded.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: the body does not read as `DevLive`/`DevEntry`, the entry''s body does
            not read as its kind''s, the turn change it implies is refused, or the hub refuses the live item.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/drafts:
    get:
      operationId: drafts.list
      tags:
      - Drafts
      summary: The drafts on a site still open or being applied
      description: Every changeset draft on `site` in state `drafting`, `ready` or `applying`, ordered by id; with
        `mine=1` only the caller's own.
      parameters:
      - name: site
        in: query
        required: true
        schema:
          type: string
        description: The site's root scope path (`customer/{customer}/site/{site}`).
      - name: mine
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 255
        description: Exactly `1` restricts the list to the caller's drafts; any other value lists everyone's.
      responses:
        '200':
          description: The drafts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftList'
        '401':
