      description: A prepared submission plan. `reads` is every scope the check's export carried, at its changeset,
        in scope order.
      required:
      - v
      - id
      - experiment
      - kind
      - scenario
      - cut
      - reads
      - prepared_at
      - runner
      - runs
      - queue
      properties:
        v:
          $ref: '#/components/schemas/PlanFormat'
        id:
          $ref: '#/components/schemas/Ulid'
        experiment:
          $ref: '#/components/schemas/Ulid'
        kind:
          $ref: '#/components/schemas/ExperimentKind'
        scenario:
          $ref: '#/components/schemas/PlanScenario'
        cut:
          $ref: '#/components/schemas/UnitCut'
        reads:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Seq'
        prepared_at:
          $ref: '#/components/schemas/WallClock'
        runner:
          $ref: '#/components/schemas/PlanRunner'
        runs:
