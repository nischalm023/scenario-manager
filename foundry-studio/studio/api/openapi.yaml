                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/find/{location}:
    get:
      tags:
      - Map
      operationId: map.find
      summary: Find entities on a site's map
      description: The entities of a site at a cut whose label, a component's name or an `external_ids` value holds
        `q`, ignoring case, each as its own mark, in mark order. Searches the loaded document, declared and derived
        entities alike.
      parameters:
      - name: location
        in: path
        required: true
        description: 'Axum wildcard (`{*location}`): the rest of the path, slashes included. A location, `{scope-path}@{pin}`,
          of a site or its map.'
        schema:
          type: string
      - name: kin
        in: query
        required: false
        description: Kin pins, `{scope}@{seq}` joined by `,`.
        schema:
          type: string
      - name: q
        in: query
        required: true
        description: What to find; trimmed and matched ignoring case. Empty or missing is refused.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: How many matches one answer holds; clamped to 1..500.
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: The first matches, and whether more matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindResults'
        '404':
          description: '`location-unresolved`: there is no such scope. Also `pin-unresolved` from world-proto-server.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: the path names no location, the query does not read, or `q` is empty.
            `ref-malformed`: the location or `kin` does not parse. `panel-mismatch`: the scope is not a site''s
            map. `floor-compile-failed`: the site''s document will not load. Also `export-not-closed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: '`wps-not-ready`: a changeset pin on a site of several scopes, or a world-proto-server failure
            so mapped.'
