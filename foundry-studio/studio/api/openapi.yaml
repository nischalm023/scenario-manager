            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: 'world-proto-server failure mapped by the client: `wps-not-ready`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 'world-proto-server failure mapped by the client: `wps-fault`, `wps-outcome-unknown`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
