      - GateIdentity: []
  /api/conversations/{conversation}/entries:
    get:
      operationId: conversations.entries
      tags:
      - Conversations
      summary: Read a page of a conversation's entries
      description: At most `limit` entries with `seq` greater than `after`, oldest first, with the projection of
        what they name; an `after` below the conversation's first entry reads from that entry. `next`, present when
        more remain, is the `after` that reads on. Read in one REPEATABLE READ transaction.
      parameters:
      - name: conversation
        in: path
