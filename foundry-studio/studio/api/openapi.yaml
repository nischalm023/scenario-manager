      operationId: templates.create
      summary: Create site from an evaluation
      description: 'A person''s press, recorded as their approval, makes evaluation `n` a new site at `customer/{customer}/site/{slug}`
        in one changeset. Under the draft''s row lock the press is checked: the draft is `open` in `create` mode,
        `evaluation` is the draft''s latest, `ready` and without an error, the generators it ran with are still
        the registry''s. The site''s plan is kept with the approval, the draft moves to `writing`, and the write
        runs after the `202`; the approval''s execution reports its end, and the draft''s `write` carries the result
        or the refusal. A press while the agent''s approval of the same act waits decides that approval (approving
        it when the values match, denying it otherwise). A draft already `writing` under the same approval answers
        `202` again. Idempotent: takes an `Idempotency-Key` header.'
