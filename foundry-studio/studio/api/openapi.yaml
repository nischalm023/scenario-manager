  /api/flow/{location}:
    get:
      operationId: flows.flow
      tags:
      - Flows
      summary: A site's flow graph at one read, compiled in validation mode
      description: Resolves the site's scopes at one cut (the location's pin, or an open draft's stored cut when
        `draft` is given), reads their flagged export and compiles it with the flow compiler in validation mode.
        Answers every node, edge, segment and return rule with what the Flow panel shows, the plan the graph compiles
        to without a scenario (null while a problem is an error or the site has no flow), every problem, the read's
        provenance (`seqs`, `exact`) and the site's newest made-from record. A site with no flow sub-scope at the
        cut answers empty lists, no plan and the warning `flow-empty`. With `draft` naming an open (or applying)
        draft on this site, the graph is drawn with the draft's patches applied in memory, each patched entity carrying
        `diff` (was and becomes), beside `draft.base.plan`, what the cut compiles to without it; a draft no longer
        open is only named with its state and the read is the location's own. An exact export's compile is kept
        under its sha256 and reused.
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
        description: 'An axum wildcard (`{*location}`) capturing a scope path with slashes: a site''s flow scope
          at a pin, `customer/{customer}/site/{site}/flow` optionally followed by `@` and a pin (`@main`, `@tag:v3`,
          `@7`); without a pin it is read at `@main`. Any other scope answers `validation-failed`.'
        example: customer/demo/site/lshape-6/flow@main
      - name: kin
        in: query
        required: false
        schema:
          type: string
        description: 'A kin pin. Not served yet: any value is refused `validation-failed` ("kin pins wait for world-proto-server''s
          reads at a version").'
      - name: draft
        in: query
        required: false
        schema:
          type: string
        description: The ULID of a changeset draft on this site to draw over the read. An id that is no ULID or
          names no draft answers `not-found`; a draft of another site answers `validation-failed`.
      responses:
        '200':
          description: The flow graph at the read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowRead'
        '401':
          description: Problem `identity-missing` (the gate's identity layer).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `not-found` (the `draft` names no draft) or `pin-unresolved` (the location's pin
            resolves to nothing).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'Problem `validation-failed`: the path is not `customer/{customer}/site/{site}/flow` at a
            pin, the query holds an unknown key or `kin`, the draft belongs to another site, or the export does
            not read; also `export-not-closed` from the world store.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal` (reading the draft or the site's made-from failed).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: Problem `wps-not-ready`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Problem `wps-fault` or `wps-outcome-unknown`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Problem `wps-unavailable` or `compute-busy` (with `retry_after_s`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
