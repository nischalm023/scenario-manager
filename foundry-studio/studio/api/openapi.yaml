      description: Only the draft's owner amends it, and only while it is open (`drafting` or `ready`). The body's
        `revision` must equal the stored one, else `draft-changed` and nothing changes. The new operations are folded
        onto the stored ones, the would-be site is checked again on the draft's own stored cut, the revision is
        incremented, the state becomes `ready` or `drafting` by whether an error remains, and a `flow.draft_changed`
