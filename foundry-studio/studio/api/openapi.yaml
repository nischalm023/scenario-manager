          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: the body does not read as `PanelEvent`, `text` is blank or over 2,000
            characters, or `body` is not an object; `idempotency-key-reused`.'
          content:
            application/problem+json:
              schema:
