      - text
      - context
      - source
      - browser_tab
      - client_message_id
      properties:
        text:
          type: string
          description: The message; must not be blank.
        context:
          description: Null when the person left the page context out.
          oneOf:
          - $ref: '#/components/schemas/PageContext'
          - type: 'null'
        source:
          $ref: '#/components/schemas/MessageSource'
        browser_tab:
          type: string
        client_message_id:
          type: string
          description: Echoed in the answer and the `message.user` entry so the page settles its optimistic entry.
        act:
          type:
          - string
