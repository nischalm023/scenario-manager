      description: 'A site read at a cut: the cut, the site, its floor''s key (for `GET /api/floors/{key}`) or,
        when the document loads but has no floor, `floor_problem` saying why, the frames, the counts of what it
        holds, the made-from record the cut stands on, and whether every read was exact. The location is a site''s
        root (`customer/c/site/s@main`, which opens its map) or its map scope (`customer/c/site/s/map@main`). Until
        world-proto-server keeps one commit order across a site''s scopes, a site of several scopes is read only
        at a branch head.'
      parameters:
      - name: location
        in: path
        required: true
        description: 'Axum wildcard (`{*location}`): the rest of the path, slashes included. A location, `{scope-path}@{pin}`.'
        schema:
          type: string
      - name: kin
        in: query
        required: false
        description: 'Kin pins, `{scope}@{seq}` joined by `,` (`flow@2,fleet@1`): kin scopes held at changesets
          beside the location.'
        schema:
          type: string
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapSummary'
        '404':
          description: '`location-unresolved`: there is no such scope. Also `pin-unresolved` from world-proto-server.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: the path names no location, or the query does not read. `ref-malformed`:
            the location or `kin` does not parse, or a kin pin does not fit beside the location. `panel-mismatch`:
            the scope is not a site''s map. `floor-compile-failed`: the site''s document will not load. Also `export-not-closed`
            from world-proto-server.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: '`wps-not-ready`: a changeset pin on a site of several scopes (read it at a branch head),
            or a world-proto-server failure so mapped.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: 'world-proto-server failure mapped by the client: `wps-fault`, `wps-outcome-unknown`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'world-proto-server failure mapped by the client: `wps-unavailable`, `compute-busy` (with
            `Retry-After`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
