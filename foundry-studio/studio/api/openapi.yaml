  /api/runs:
    post:
      operationId: runs.submit
      tags:
      - Runs
      summary: Submit a ready plan (the press of Run)
      description: 'Executes a ready plan (spec 08 section 3.3, rule 8) as the person''s approval (spec 01 section
        3.10, rule 6).

        The body names the plan and the `plan_sha256` the person saw; the hash must equal the one

        `GET /api/runs/plan/{plan}` answered, or the press is refused `plan-stale`.


        Under the plan''s row lock the press checks: the plan is `ready` (`plan-not-ready`), the hash matches

        (`plan-stale`), the experiment has no other press or submission (`experiment-submitted`), and the scenario

        version still stands at the plan''s revision (`plan-stale`). It then records the press as the approval,
        keeps

        it on the plan, and answers `202` with the approval''s record before the execution starts. A press repeated

        while or after it executes answers the same approval.


        The execution runs in a task of its own: it seals the scenario version, inserts the submission, its runs
        and

        one queued attempt each, and records the approval''s `execution` as `ok` (its `outcome` a `Submitted`) or

        `failed` with the refusal (a `Problem`, e.g. `plan-stale`, `scenario-deleted`, `not-found`,

        `experiment-submitted`). Poll `GET /api/approvals/{approval}` to follow it.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '202':
          description: The press is recorded as an approval; its execution follows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAnswer'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          description: Problem type `idempotency-key-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem type `not-found` (no plan has that id).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem types `plan-not-ready`, `plan-stale` (hash differs, or the scenario version's revision
            moved), `experiment-submitted` or `idempotency-key-in-flight`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem types `validation-failed` (the body does not read), `idempotency-key-reused` or `project-required`
            (no default project exists to open the site's conversation in).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
    get:
      operationId: runs.list
      tags:
      - Runs
      summary: List runs
      description: 'Runs newest submission first, a page at a time. `next` names the page''s last run, which `after`
        continues

        from, while more runs follow it. `highlights` names the agent''s `show` journal entry whose metrics headline

        a run whose project pins none. By default the list is scoped to a site when `site` is given (spec 08

        section 3.7); the exact default scope without `site` is decided by the row filter (unclear from code).

        '
      parameters:
      - name: site
        in: query
        required: false
        description: Restrict to runs of this site.
        schema:
          type: string
      - name: mine
        in: query
        required: false
        description: When true, only runs the caller submitted.
        schema:
          type: boolean
          default: false
      - name: scenario
        in: query
        required: false
        description: Restrict to runs of this scenario.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: submission
        in: query
        required: false
        description: Restrict to runs of this submission.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: state
        in: query
        required: false
        description: Restrict to runs whose latest attempt is in this state.
        schema:
          $ref: '#/components/schemas/RunState'
      - name: after
        in: query
        required: false
        description: Continue after this run, the previous page's `next`. Must name an existing run.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: limit
        in: query
        required: false
        description: Page size, clamped to 1..200.
        schema:
          type: integer
          format: int64
          default: 50
          minimum: 1
          maximum: 200
      - name: highlights
        in: query
        required: false
        description: The journal sequence of the agent's `show` entry whose metrics headline runs whose project
          pins none.
        schema:
          $ref: '#/components/schemas/JournalSeq'
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '422':
          description: Problem type `validation-failed` (the query does not read, or `after` names no run).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no route serves this path, or the object named does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/compare:
    get:
      tags:
      - Results
      operationId: results.compare
      summary: Compare 2 to 12 runs; inputs that differ, inputs that are the same, then metrics
      description: 'Every input that differs between the compared runs is stated first, each marked as the experiment''s

        design (`by_experiment`: its varied field, its repeats'' seeds when the runs come from one experiment, and

        the workload a varied generator field makes) or as differing outside it, which `warns`, except a read''s

        exactness and the compiler''s version, provenance that never warns; then what is the same; then the

        metrics. Inputs are classified on their canonical values; when two runs whose canonical values differ

        would read alike, every value is said exactly. Only runs whose latest attempt finished are compared; the

        others are listed in `not_compared` and never combined. A metric is comparable only when every compared

        run reports it over one window with one unit, aggregation and denominator; else `comparable` is false and

        `reason` says why. Each run''s metrics are read over its report window; a run whose report window end is
        not

        a recorded instant makes every metric not comparable with that reason.


        `reference` is the run the others are measured against: the one asked when it is among the finished runs,

        else the first finished run in `ids` order, else the first id. `metrics` names which metrics to compare;

        when absent, the reference run''s headline metrics (its project''s pins that it declared, else the first

        four it declared).

        '
      parameters:
      - name: ids
        in: query
        required: true
        description: Comma-separated run ids (ULIDs), 2 to 12, none repeated. Empty segments are ignored.
        schema:
          type: string
        example: 01J8X9Y0Z1A2B3C4D5E6F7G8H9,01J8X9Y0Z1A2B3C4D5E6F7G8HA
      - name: metrics
        in: query
        required: false
        description: Comma-separated metric names, 1 to 8; each must be declared by at least one compared run. Default
          is the reference run's headline metrics.
        schema:
          type: string
      - name: reference
        in: query
        required: false
        description: The id of the run the others are measured against; must be one of `ids`.
        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareReply'
        '401':
          description: Problem `identity-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem `not-found`; one of `ids` names no run.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem `validation-failed`; the query does not parse, `ids` names fewer than 2 or more than
            12 runs, an id does not parse or repeats, `metrics` names 0 or more than 8, `reference` does not parse
            or is not among `ids`, or a named metric was declared by no compared run.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/plan:
    post:
      operationId: runs.plan_ask
      tags:
      - Runs
      summary: Prepare a submission plan for an experiment
      description: 'Starts preparing a submission plan (spec 08 section 3.3) for an experiment, so that an approval
        approves

        pinned inputs: one consistent cut of the site at `main`, the export whose `scopes` are the plan''s

        reads, every distinct variant checked and compiled on the compute pool, and each run''s expectation recorded.

        Answers `202 { plan }` at once; the plan is prepared in wall clock afterwards. Poll

        `GET /api/runs/plan/{plan}` about once a second until its `state` is `ready` or `failed`.


        A preparation of the same experiment, runner image and shown `cut` already under way answers that same plan

        id instead of starting another. If no runner image is registered, the request still answers `202`, but the

        plan is recorded `failed` at once with a `no-runner-image` problem readable from `GET /api/runs/plan/{plan}`.

        Preparing writes nothing but the plan''s own row.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '202':
          description: The plan is being prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAccepted'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          description: Problem type `idempotency-key-missing`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem type `not-found` (no experiment has that id).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem types `experiment-submitted` (the experiment's runs were submitted already) or `idempotency-key-in-flight`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem types `validation-failed` (the body does not read, or an unknown field) or `idempotency-key-reused`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/plan/{plan}:
    get:
      operationId: runs.plan_read
      tags:
      - Runs
      summary: Read a submission plan
      description: 'The plan''s state and progress; once `ready`, the plan itself with its `plan_sha256`, which
        `POST /api/runs`

        must echo; once `failed`, the one problem that failed it (types seen in code: `no-runner-image`, `plan-stale`,

        `validation-failed` with per-field `problems` items coded `validation-failed` or `window-not-recorded`,

        `not-found` when the scenario names no site, `internal` when the service restarted while preparing, and
        the

        world-proto-server client''s `wps-*`/`compute-busy` types).


        `plan_sha256` is the lowercase hex SHA-256 of the plan''s RFC 8785 (JCS) canonical JSON with the `queue`

        field removed; `queue` is information for the card, never an input.

        '
      parameters:
      - name: plan
        in: path
        required: true
        description: The plan's ULID.
        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: The plan as it stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRead'
        '404':
          description: Problem type `not-found` (no plan has that id, or the path is not a ULID).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '`identity-missing`: the request names nobody (no gate identity headers).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/runs/queue:
