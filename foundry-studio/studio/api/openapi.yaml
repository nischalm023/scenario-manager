      type: number
      minimum: 0
      maximum: 1
      description: The share of the stock placed on the racks at simtime 0.
    Problem:
      type: object
      description: An error as the service answers it (RFC 9457, spec 01 section 3.14) with its extensions.
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          $ref: '#/components/schemas/ProblemType'
        title:
          type: string
          description: The type's summary, the same at every occurrence.
        status:
          type: integer
          description: The HTTP status of the answer, repeated in the body.
        detail:
          type: string
          description: This occurrence, in words a person can act on.
        instance:
          type: string
          description: The path of the request refused.
        problems:
          type: array
          description: Each thing wrong, when a check found several.
          items:
            $ref: '#/components/schemas/ProblemItem'
        moved:
          type: array
          description: With `head-moved`, every scope that moved past the base it was read at.
          items:
            $ref: '#/components/schemas/MovedScope'
        uncertain:
          type: array
          description: With `wps-outcome-unknown`, the scopes whose write is not yet known to have landed.
          items:
            $ref: '#/components/schemas/ScopePath'
        retry_after_s:
          type: integer
          minimum: 1
          description: With a busy answer, wall-clock seconds to wait, which `Retry-After` repeats.
        conflicts:
          type: array
          description: With `scenario-changed`, each field the edit could not set.
          items:
            $ref: '#/components/schemas/FieldConflict'
    ProblemItem:
      type: object
      description: One thing wrong, and where it is as far as the finding knows.
      required:
      - code
      - severity
      - text
      properties:
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        ref:
          $ref: '#/components/schemas/Key'
        scope:
          $ref: '#/components/schemas/ScopePath'
        field:
          type: string
          description: A JSON pointer into the body.
        knob:
          type: string
          description: A template knob's key.
        text:
          type: string
    ProblemType:
      type: string
      description: 'The `type` slug of a refusal and its usual status. 400: idempotency-key-missing. 401: identity-missing,

        runner-token-invalid. 403: not-conversation-owner, not-draft-owner, not-this-run, approval-required.

        404: not-found, pin-unresolved (422 when the pin is in a body), location-unresolved.

        409: idempotency-key-in-flight, conversation-closed, turn-running, head-moved, generators-moved, site-exists,

        knob-changed, draft-not-open, evaluation-stale, scenario-changed, name-taken, scenario-deleted, plan-stale,

        draft-changed, stale-draft, draft-applying, plan-not-ready, experiment-submitted, no-runner-image,

        not-fetched, manifest-differs, no-recording, attempt-ended, recording-differs, not-streamed, turn-not-waiting,
        question-closed, approval-closed,

        conversation-too-long, stale-approval, provider-changed. 422: project-required, validation-failed,

        idempotency-key-reused, ref-malformed, ref-pin-conflicts, ref-needs-version, export-not-closed,

        floor-compile-failed, ref-unresolved, panel-mismatch, result-too-large, no-panel-context.

        429: turn-budget. 500: internal. 501: wps-not-ready, not-built. 502: wps-outcome-unknown, wps-fault.

        503: wps-unavailable, compute-busy, agent-busy, model-unavailable. 504: tool-timeout.

        '
      enum:
      - identity-missing
      - not-found
      - validation-failed
      - idempotency-key-missing
      - idempotency-key-reused
      - idempotency-key-in-flight
      - not-conversation-owner
      - conversation-closed
      - turn-running
      - project-required
      - ref-malformed
      - ref-pin-conflicts
      - ref-needs-version
      - head-moved
      - generators-moved
      - export-not-closed
      - pin-unresolved
      - site-exists
      - wps-not-ready
      - wps-unavailable
      - wps-outcome-unknown
      - wps-fault
      - compute-busy
      - internal
      - knob-changed
      - draft-not-open
      - evaluation-stale
      - floor-compile-failed
      - location-unresolved
      - ref-unresolved
      - panel-mismatch
      - scenario-changed
      - name-taken
      - scenario-deleted
      - plan-stale
      - draft-changed
      - stale-draft
      - not-draft-owner
      - draft-applying
      - plan-not-ready
      - experiment-submitted
      - no-runner-image
      - not-fetched
      - manifest-differs
      - runner-token-invalid
      - not-this-run
      - no-recording
      - attempt-ended
      - recording-differs
      - not-streamed
      - turn-not-waiting
      - question-closed
      - approval-closed
      - conversation-too-long
      - agent-busy
      - not-built
      - model-unavailable
      - approval-required
      - stale-approval
      - tool-timeout
      - result-too-large
      - no-panel-context
      - provider-changed
      - turn-budget
    ProgressValue:
