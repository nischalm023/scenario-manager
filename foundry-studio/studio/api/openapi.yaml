      required:
      - unit
      - requested
      - branch
      - seqs
      - exact
      - exact_reason
      properties:
        unit:
          $ref: '#/components/schemas/ScopePath'
        requested:
          $ref: '#/components/schemas/Pin'
        branch:
          $ref: '#/components/schemas/BranchName'
        seqs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Seq'
        exact:
          type: boolean
        exact_reason:
          type:
          - string
          - 'null'
    UnitMm:
      type: number
      format: double
      exclusiveMinimum: 0
      description: What one step of a frame is worth in millimetres (0.1 by a site's default); finite and above
        zero.
    UnitsPerTote:
      type: integer
      format: int32
      minimum: 0
      description: Units one stored tote holds when the stock is placed; 1 to 10,000.
    ValueBasis:
      type: string
      enum:
      - end_block
      - rebuilt
      - window_difference
    Variant:
      type: object
      required:
      - n
      - label
      - patches
      properties:
        n:
          $ref: '#/components/schemas/VariantNumber'
        label:
          type: string
          description: '"as the scenario states" for the unpatched variant; "{short_label} {value}" for a sweep''s.'
        patches:
          type: array
          description: At most one patch per variant.
          items:
            $ref: '#/components/schemas/Patch'
    VariantNumber:
      type: integer
      format: int32
      minimum: 1
      description: A variant's number, from 1.
    Varied:
      type: object
      description: The varied field as a sweep keeps it for display.
      required:
      - target
      - pointer
      - label
      - short_label
      - unit
      - values
      properties:
        target:
          type: string
        pointer:
          type: string
        label:
          type: string
        short_label:
          type: string
        unit:
          type: string
        values:
          type: array
          items: {}
    VariedValue:
      type: object
      description: 'One varied input as a run states it: the field''s label and its value in words.'
      required:
      - label
      - value
      properties:
        label:
          type: string
        value:
          type: string
    VariesRequest:
      type: object
      additionalProperties: false
      description: 'The one field a sweep varies: a target, a JSON pointer into it, and 2 to 12 distinct values.'
      required:
      - target
      - pointer
      - values
      properties:
        target:
          type: string
          description: '`scenario:{ULID}` of the scenario itself; a sweep varies only this scenario''s own fields
            in this cut.'
        pointer:
          type: string
          description: A catalogue field whose entry is `sweepable`.
        values:
          type: array
          minItems: 2
          maxItems: 12
          items: {}
    VersionNumber:
      type: integer
      format: int32
      minimum: 0
      description: A scenario version's number, from 1.
    VersionRead:
      type: object
      required:
      - n
      - state
      - revision
      - content
      - set_by
      properties:
        n:
          $ref: '#/components/schemas/VersionNumber'
        state:
          $ref: '#/components/schemas/VersionState'
        revision:
          $ref: '#/components/schemas/Revision'
        content:
          $ref: '#/components/schemas/ScenarioContent'
        set_by:
          type: object
          description: Each field's last change, keyed by JSON pointer, in pointer order.
          additionalProperties:
            $ref: '#/components/schemas/SetBy'
    VersionState:
      type: string
      enum:
      - open
      - sealed
    VersionSummary:
      type: object
      required:
      - version
      - state
      - sealed_at
      - experiments
      properties:
        version:
          $ref: '#/components/schemas/VersionNumber'
        state:
          $ref: '#/components/schemas/VersionState'
        sealed_at:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'
        experiments:
          type: array
          description: The experiments prepared from this version.
          items:
            $ref: '#/components/schemas/Ulid'
    Waiting:
      type: object
      required:
      - for
      properties:
        for:
          $ref: '#/components/schemas/WaitingFor'
        place_in_queue:
          oneOf:
          - $ref: '#/components/schemas/RunPosition'
          - type: 'null'
    WaitingFor:
      type: string
      description: 'What a queued run waits for: a seat, or its runner while holding a seat.'
      enum:
      - seat
      - runner
    WaitingOn:
      type: string
      enum:
      - question
      - approval
      description: What a waiting turn waits on.
    WallClock:
      type: string
      format: date-time
      description: An instant on the wall clock, RFC 3339 in UTC (`2026-10-18T19:23:24.512Z`).
    WallMs:
      type: integer
      format: int64
      minimum: 0
      description: A wall-clock duration in milliseconds.
    WatchTicket:
      type: object
      description: '`200` to `POST /api/runs/{run}/watch`: a ticket to watch the run''s latest attempt live (ruling
        D174): the streaming server''s websocket for that attempt, the token a viewer presents there in its first
        message, `watch`, and when the ticket stops opening it. Each ask mints a ticket of its own.'
      required:
      - run
      - attempt
      - url
      - token
      - expires_at
      properties:
        run:
          $ref: '#/components/schemas/Ulid'
        attempt:
          $ref: '#/components/schemas/AttemptNumber'
        url:
          type: string
        token:
          type: string
        expires_at:
          $ref: '#/components/schemas/WallClock'
    Workload:
      type: object
      additionalProperties: false
      required:
      - generator
      - order_trays
      properties:
        generator:
          $ref: '#/components/schemas/GeneratorSpec'
        order_trays:
          $ref: '#/components/schemas/OrderTrays'
    WorkloadHeader:
      type: object
      description: The stream's first line.
      required:
      - v
      - generator
      - orders
      - lines
      - skus
      - preload_fraction
      properties:
        v:
          type: integer
          format: int32
        generator:
          type: string
          description: The generator crate's version.
        orders:
          $ref: '#/components/schemas/Tally'
        lines:
          $ref: '#/components/schemas/Tally'
        skus:
          $ref: '#/components/schemas/Tally'
        preload_fraction:
          $ref: '#/components/schemas/PreloadFraction'
    WorkloadItem:
      type: object
      description: One SKU holding stock, and how many units the run starts with or brings in.
      required:
      - sku
      - units
      properties:
        sku:
          type: string
        units:
          $ref: '#/components/schemas/Tally'
    WorkloadLine:
      description: 'One NDJSON line, externally tagged by its variant name: `{"header": ...}`, `{"item": ...}` or
        `{"order": ...}`.'
      oneOf:
      - type: object
        required:
        - header
        additionalProperties: false
        properties:
          header:
            $ref: '#/components/schemas/WorkloadHeader'
      - type: object
        required:
        - item
        additionalProperties: false
        properties:
          item:
            $ref: '#/components/schemas/WorkloadItem'
      - type: object
        required:
        - order
        additionalProperties: false
        properties:
          order:
            $ref: '#/components/schemas/WorkloadOrder'
    WorkloadOrder:
      type: object
      description: One order, its arrival in simtime and its lines.
      required:
      - id
      - arrival_ms
      - lines
      properties:
        id:
          type: string
        arrival_ms:
          type: integer
          format: int64
          description: Simtime milliseconds.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    WorkloadRead:
      type: object
      description: 'The workload the generator made for the run: the body sent, the generator''s seed and version,
        and what came back.'
      required:
      - spec
      - seed
      - generator
      - sha256
      - bytes
      properties:
        spec:
          $ref: '#/components/schemas/GenerateRequest'
        seed:
          $ref: '#/components/schemas/Seed'
        generator:
          type: string
        sha256:
          type: string
        bytes:
          $ref: '#/components/schemas/ByteCount'
    WorkloadSummary:
      type: object
      required:
      - orders
      - lines
      - skus
      - preload_fraction
      properties:
        orders:
          $ref: '#/components/schemas/Tally'
        lines:
          $ref: '#/components/schemas/Tally'
        skus:
          $ref: '#/components/schemas/Tally'
        preload_fraction:
          $ref: '#/components/schemas/PreloadFraction'
    WorldCount:
      type: integer
      format: int32
      minimum: 0
      description: A count of worlds loaded by a plan's check.
    WorldRead:
      type: object
      description: 'The world a run read: the export before the variant, by its hash, every scope it holds entities
        from, how far its closure was vouched for and its exactness; who assembled it and who generated its derived
        entities; and the primary frame of the world the runner loaded.'
      required:
      - sha256
      - scopes
      - walked
      - exact
      - exact_reason
      - assembled_by
      - derived_by
      - primary_frame
      properties:
        sha256:
          type: string
        scopes:
          type: object
          description: Every scope the export holds entities from, whole or in part, at the changeset it was read at,
            keyed by scope path.
          additionalProperties:
            $ref: '#/components/schemas/Seq'
        walked:
          type: string
          description: '`annotations` or `annotations-and-list:{digest}`.'
        exact:
          type: boolean
        exact_reason:
          type:
          - string
          - 'null'
        assembled_by:
          type: string
          description: '`server`: WPS writes the site as its flagged export.'
        derived_by:
          type: string
          description: '`server`: WPS generated the derived entities the export carries.'
        primary_frame:
          type:
          - string
          - 'null'
          description: The loaded world's primary frame, the frame that states `unit_mm`.
    WriteAccepted:
      type: object
      description: '`202` to a write: the approval it runs under, whose execution reports its end, and the draft
        it writes.'
      required:
      - approval
      - draft
      properties:
        approval:
          $ref: '#/components/schemas/ApprovalRecord'
        draft:
          $ref: '#/components/schemas/Ulid'
    Heartbeat:
      type: object
      description: 'Body of `PUT /runner/v1/attempts/{run}/{n}/heartbeat`, every 5 s of wall clock from the runner''s
        start: how far the run is in simtime and its counters so far, zeros before simtime starts.'
      required:
      - sim_ms
      - values
      properties:
        sim_ms:
          type: integer
          format: int64
          minimum: 0
        values:
          type: array
          items:
            $ref: '#/components/schemas/ProgressValue'
    RecordingStored:
      type: object
      description: '200 to `PUT /runner/v1/attempts/{run}/{n}/recording`: the runner''s recording as the API stored it
        under the attempt''s key in the run store, which the runner''s report then names: its key, how far it reaches
        in simtime, its frames and its size.'
      required:
      - key
      - frames
      - bytes
      properties:
        key:
          type: string
          description: The object's key, `runs/{run}/attempts/{n}/recording.worldview`.
        live_edge_sim_ms:
          type: integer
          format: int64
          minimum: 0
        frames:
          type: integer
          format: int64
          minimum: 0
        bytes:
          $ref: '#/components/schemas/ByteCount'
    ResultsReport:
      type: object
      description: 'Body of `PUT /runner/v1/attempts/{run}/{n}/results`: what the runner left, delivered by the runner
        itself once the run is over. The recording went up first, through `PUT .../recording`, whose answer
        `recording` is.'
      additionalProperties: false
      required:
      - v
      - ending
      - metrics
      - series
      - recording
      - runner_commit
      - runner_dirty
      properties:
        v:
          $ref: '#/components/schemas/FileFormat'
        ending:
          $ref: '#/components/schemas/Ending'
        metrics:
          oneOf:
          - $ref: '#/components/schemas/MetricsFile'
          - type: 'null'
        series:
          oneOf:
          - $ref: '#/components/schemas/SeriesFile'
          - type: 'null'
        recording:
          oneOf:
          - $ref: '#/components/schemas/RecordingStored'
          - type: 'null'
        runner_commit:
          type:
          - string
          - 'null'
        runner_dirty:
          type:
          - boolean
          - 'null'
    ResultsEnded:
      type: string
      description: 'Whether a report''s ending took: the first ending wins, and a later report changes nothing.'
      enum:
      - wrote
      - already-ended
    ResultsAccepted:
      type: object
      description: 200 to `PUT /runner/v1/attempts/{run}/{n}/results`.
      required:
      - ended
      properties:
        ended:
          $ref: '#/components/schemas/ResultsEnded'
    EndingCounts:
      type: object
      description: How many runs ended in each way.
      required:
      - finished
      - cancelled
      - failed
      - partial
      properties:
        finished:
          $ref: '#/components/schemas/RunCount'
        cancelled:
          $ref: '#/components/schemas/RunCount'
        failed:
          $ref: '#/components/schemas/RunCount'
        partial:
          $ref: '#/components/schemas/RunCount'
    SeatsRead:
      type: object
      description: 'The seats: how many may be held at once across the deployment, and how many are.'
      required:
      - limit
      - held
      properties:
        limit:
          $ref: '#/components/schemas/RunCount'
        held:
          $ref: '#/components/schemas/RunCount'
    RunStats:
      type: object
      description: 'Answer of `GET /api/runs/stats`: the deployment''s runs counted off the attempts'' rows. Counters
        and gauges, so a metrics exposition can be laid over them.'
      required:
      - seats
      - waiting
      - running
      - stalled
      - ended_last_24h
      - create_failures_last_24h
      properties:
        seats:
          $ref: '#/components/schemas/SeatsRead'
        waiting:
          $ref: '#/components/schemas/RunCount'
        running:
          $ref: '#/components/schemas/RunCount'
        stalled:
          description: Running with its runner not heard for 30 s of wall clock, by its heartbeat or, before its first,
            by its manifest.
          $ref: '#/components/schemas/RunCount'
        ended_last_24h:
          description: How the last 24 h of wall clock ended; `partial` is a runner lost.
          $ref: '#/components/schemas/EndingCounts'
        create_failures_last_24h:
          description: Attempts whose Job could not be created after the retries, in the last 24 h of wall clock.
          $ref: '#/components/schemas/RunCount'
        oldest_waiting_since:
          oneOf:
          - $ref: '#/components/schemas/WallClock'
          - type: 'null'

paths:
  /api/approvals/{approval}:
    get:
      operationId: approvals.read
      tags:
      - Agent
      summary: Read an approval
      description: 'The approval''s record: its tool and class, how it was given, its state and execution, the sentence
        of a failed or unknown execution and what the act answered once it ended. A page with no conversation attached
        reads this once a second (wall clock) after a press until the execution ends.'
      parameters:
      - name: approval
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: The approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAnswer'
        '401':
          description: '`identity-missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no approval has that id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/approvals/{approval}/decision:
    post:
      operationId: agent.cards.decision
      tags:
      - Agent
      summary: Approve or deny the agent's approval request
      description: Records the decision with who pressed, journals `approval.decided` and `turn.resumed`, and resumes
        the turn. `reason` is kept only with a denial. The same decision again answers as the first did; a different
        one is `approval-closed`. For an approval given by a button rather than a card (no turn waits on it), `approve`
        answers the record unchanged and `deny` is `approval-closed`. The answer is the approval's current record.
      parameters:
      - name: approval
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDecision'
      responses:
        '200':
          description: The approval as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAnswer'
        '401':
          description: '`identity-missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`not-conversation-owner`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no approval has that id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`approval-closed`: already decided otherwise or expired; `conversation-closed`; `turn-not-waiting`;
            `provider-changed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: the body does not read as `PostDecision`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: '`agent-busy` (`Retry-After: 60`).'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/conversations:
    post:
      operationId: conversations.open
      tags:
      - Conversations
      summary: Open a site's live conversation or the person's new-site thread
      description: With `site`, answers the site's live conversation, making it when the site has none (the new
        one numbers on from where the site's last conversation stopped). With an empty body (`{}` or no body), answers
        the asker's live new-site thread, making it when they have none. `201` when this request made the conversation,
        `200` when it already existed. Only a site that world-proto-server lists has a conversation to open; the
        customer's whole site list is read to decide that.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenConversation'
      responses:
        '200':
          description: The conversation that was already live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenedConversation'
        '201':
          description: The conversation this request made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenedConversation'
        '401':
          description: '`identity-missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: world-proto-server lists no such site.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: the body does not read as `OpenConversation`; `project-required`: no
            project is the default, so a new conversation has none to belong to.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: '`wps-not-ready`: relayed from the world-proto-server client while listing sites.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: '`wps-outcome-unknown`, `wps-fault`: relayed from the world-proto-server client while listing
            sites.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: '`wps-unavailable`, `compute-busy` (with `Retry-After`): relayed from the world-proto-server
            client while listing sites.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
    get:
      operationId: conversations.list
      tags:
      - Conversations
      summary: List a site's conversations
      description: The site's live conversation, then its archived ones, newest first by `first_seq`. Each row carries
        what the live conversation's open turn waits on (`null` unless a turn is `waiting`) and the wall-clock times
        of its first and last entries. `next`, present when more remain, is the `before` that reads the next page.
      parameters:
      - name: site
        in: query
        required: true
        description: The site's root scope path.
        schema:
          $ref: '#/components/schemas/SitePath'
      - name: before
        in: query
        required: false
        description: Only conversations whose `first_seq` is below this journal number.
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        required: false
        description: Page size; clamped to 1..100.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: One page of the site's conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '401':
          description: '`identity-missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`validation-failed`: the query does not read (for example `site` missing or malformed).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no route serves this path, or the object named does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/conversations/{conversation}:
    get:
      operationId: conversations.snapshot
      tags:
      - Conversations
      summary: Read a conversation's snapshot
      description: 'Read in one REPEATABLE READ transaction at the conversation''s `last_seq`: the conversation,
        its last 200 entries oldest first, the projection of what the whole journal names (folded from every entry
        of the projected kinds), every pending question, approval and open draft, and the turn running or waiting
        with the text blocks still streaming (a block whose `text.done` is among the entries is left out).'
      parameters:
      - name: conversation
        in: path
        required: true
        description: The conversation's ULID; one that is no ULID answers `not-found`.
        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          description: '`identity-missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no conversation has that id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - GateIdentity: []
  /api/conversations/{conversation}/dismiss:
    post:
      operationId: conversations.dismiss_route
      tags:
      - Conversations
      summary: Dismiss a conversation
      description: A site's live conversation is archived and the site's next live one made in the same transaction,
        numbering on from the archived one's last entry; a new-site thread, which only its maker may dismiss, is
        discarded. Either journals `conversation.changed` as the ended conversation's last entry. Refused while
        a turn of it runs or waits. A repeat on an already archived or discarded conversation answers the first
        outcome again. Takes no body.
      parameters:
      - name: conversation
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: The outcome; the same for a repeat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dismissed'
        '401':
          description: '`identity-missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`not-conversation-owner`: the new-site thread is another person''s.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no conversation has that id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`turn-running`: a turn of the conversation runs or waits; stop it or wait.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '`internal` (including an archived conversation whose last entry names no next).'
