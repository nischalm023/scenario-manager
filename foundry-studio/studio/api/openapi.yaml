      description: 'Resolves and exports the site as `GET /api/flow/{location}` does, compiles it in validation
        mode and lists every scalar field of a flow entity from the field catalogue: its label, value, unit, clock,
        whether a sweep may vary it and a closed field''s options. A site whose export states no flow entity answers
