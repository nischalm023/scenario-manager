[package]
name = "desmap"
version = "0.1.0"
edition = "2024"
description = "Warehouse graph representation (desgraph) and desmap JSON serialization format"

[dependencies]
csv = "1"
desgraph = { path = "../desgraph" }
petgraph = { version = "0.8", features = ["serde-1"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"

[dev-dependencies]
serde_json = "1"
