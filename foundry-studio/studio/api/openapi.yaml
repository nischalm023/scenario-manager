  /runner/v1/workloads/generate:
    servers:
    - url: http://127.0.0.1:3101
      description: The runners' listener (`STUDIO_RUNNER_BIND`; its port varies per checkout).
    post:
      operationId: runner.generate
      tags:
      - RunnerDoor
      summary: Generate a workload as an NDJSON stream
      description: 'Served on the runners'' listener; opens only with an attempt''s bearer token (any live attempt''s).
        A workload

        spec in, the generator''s NDJSON out as the compute pool makes it (spec 07 section 3.8): the same bytes
        for

        the same body from every build of the generator crate''s version; nothing is stored (ruling D96). The body
        is

        checked as a scenario version''s own content is (`v` must be 1, the generator spec and duration valid),
        each

        violation an item naming its field. The response body is `application/x-ndjson`: one `WorkloadLine` JSON

        object per line, the header first, then an item per SKU holding stock, then an order per order in arrival

        order, streamed through a bounded channel so a slow reader slows the generator rather than buffering it.

        '
      security:
      - RunnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: The workload, one JSON object per line.
          content:
            application/x-ndjson:
              schema:
                description: Each line of the stream is one `WorkloadLine` serialized as JSON, lines separated by
                  `\n`.
                $ref: '#/components/schemas/WorkloadLine'
        '401':
          description: Problem type `runner-token-invalid`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem type `validation-failed` (the body does not read, or `problems` lists each violated
            field).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Problem type `internal`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Problem type `compute-busy`, with `retry_after_s` and a `Retry-After` header.
          headers:
            Retry-After:
              description: Whole wall-clock seconds to wait before asking again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: '`not-found`: no route serves this path, or the object named does not exist.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
