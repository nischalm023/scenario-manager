        plan:
          $ref: '#/components/schemas/Ulid'
        experiment:
          $ref: '#/components/schemas/Ulid'
        cut:
          $ref: '#/components/schemas/UnitCut'
        reads:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Seq'
        scenario:
          $ref: '#/components/schemas/PinnedScenario'
        variant:
          type: array
          items:
            $ref: '#/components/schemas/Patch'
        seed:
          $ref: '#/components/schemas/Seed'
        duration_sim_ms:
          type: integer
          format: int64
          description: Simtime milliseconds.
        report_window:
          $ref: '#/components/schemas/ReportWindow'
        runner:
          $ref: '#/components/schemas/PinnedImage'
        expected:
          $ref: '#/components/schemas/Expectation'
        wps:
          $ref: '#/components/schemas/Endpoint'
    Plan:
