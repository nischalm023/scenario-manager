        metric:
          type: string
        label:
          type: string
        description:
          type: string
        unit:
          $ref: '#/components/schemas/MetricUnit'
        clock:
          $ref: '#/components/schemas/DurationClock'
        aggregation:
          $ref: '#/components/schemas/Aggregation'
        denominator:
          type:
          - string
          - 'null'
        value:
          type:
          - number
          - 'null'
        window:
          $ref: '#/components/schemas/SimWindow'
        basis:
          $ref: '#/components/schemas/ValueBasis'
    MetricSeries:
      type: object
