        only with the attempt''s own bearer token, matched by SHA-256 and dead once the attempt''s Job is known

        stopped. The path must name the attempt the token opens. Answers the attempt row''s current cancellation
        request. The runner relays a true request to its simulator; SIGTERM is a platform termination.

        '
      security:
      - RunnerToken: []
      parameters:
      - name: run
        in: path
        required: true
        description: The run's ULID.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: n
        in: path
        required: true
        description: The attempt number within the run, from 1.
        schema:
          $ref: '#/components/schemas/AttemptNumber'
      responses:
        '200':
          description: The attempt's live control.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptControl'
        '401':
          description: Problem type `runner-token-invalid` (no bearer token, a wrong one, a stopped attempt's, or
            one that opens another attempt than the path names).
          content:
